<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress — CandleLit Studio</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Task completion by day.">
<style>
  /* Fills are darkened steps of validated hues so WHITE LABEL TEXT clears
     4.5:1 at the lightest end of each gradient — the bright originals failed
     it badly (the green sat near 2.6:1). They also hold 4:1 against both page
     surfaces and pass all-pairs colourblind separation. */
  :root{
    color-scheme: light;
    --plane:#fbfbfa; --surface:#fff;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#8a8983;
    --rule:#e6e5e2; --ring:rgba(11,11,11,.09);
    --gw-a:#2976d2;    --gw-b:#2261ac;
    --admin-a:#c1552b; --admin-b:#9e4623;
    --site-a:#15875e;  --site-b:#116f4d;
    --park-a:#767671;  --park-b:#61615d;
    --rest:#4c4b47;
    --on:#fff;
    /* WORK TYPE — what KIND of work, now the chip fill. The project moved to
       the glyph, because two categorical colour dimensions cannot both be
       colour. Donis picked light blue / salad green / yellow / pink; three are
       darkened here until white label text clears 4.5:1.
       YELLOW IS THE EXCEPTION AND IT MATTERS: darkened enough for white text
       it turns olive, and olive against dark yellow-green measured ΔE 2.1 for
       protanopia and 8.0 for NORMAL vision — indistinguishable to everyone.
       Left bright with DARK ink instead (10.3:1) it stays yellow and the set
       passes: worst all-pairs ΔE 8.2 CVD, 19.7 normal. It sits outside the
       lightness band on purpose, exactly as a warning colour does. */
    --w-script-a:#387aae; --w-script-b:#2e648f;
    --w-ui-a:#5c8125;     --w-ui-b:#4b6a1e;
    --w-art-a:#e8bd22;    --w-art-b:#c9a316;
    --w-market-a:#bf4c80; --w-market-b:#9d3e69;
    --w-none-a:#767671;   --w-none-b:#61615d;
    /* PEOPLE. The four category hues above already own blue / orange / green /
       grey, so violet and magenta are what is left that cannot be mistaken for
       a category. Both clear 4.5:1 against the white initial (6.0 and 5.5) —
       and the initial is the real encoding, colour only reinforces it, the
       same way size is backed by the word on the detail page. */
    --who-don:#6d4aca; --who-anna:#c02a6e;
    --glass:rgba(255,255,255,.82); --glass-ring:rgba(11,11,11,.10);
    --shadow:0 1px 2px rgba(11,11,11,.07);
    --now-shadow:0 2px 10px rgba(11,11,11,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --plane:#141413; --surface:#1e1e1c;
      --ink:#fff; --ink-2:#c3c2b7; --ink-muted:#8e8d87;
      --rule:#2c2c2a; --ring:rgba(255,255,255,.11);
      --rest:#565550;
      --glass:rgba(30,30,28,.84); --glass-ring:rgba(255,255,255,.13);
      --shadow:none; --now-shadow:0 2px 12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#141413; --surface:#1e1e1c;
    --ink:#fff; --ink-2:#c3c2b7; --ink-muted:#8e8d87;
    --rule:#2c2c2a; --ring:rgba(255,255,255,.11);
    --rest:#565550;
    --glass:rgba(30,30,28,.84); --glass-ring:rgba(255,255,255,.13);
    --shadow:none; --now-shadow:0 2px 12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--plane);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:600px;margin:0 auto;
        padding:16px 14px calc(48px + env(safe-area-inset-bottom))}

  /* ---------------- desktop shell ----------------
     Phone stays exactly as it was: one column, the rails simply absent. The
     side columns only exist above 1080px, where there is room for them
     WITHOUT squeezing the feed — the feed keeps its 600px either way, so the
     chips never reflow between layouts. */
  .shell{display:block}
  .rail,.cal{display:none}
  /* WIDTH ALONE IS NOT "IS THIS A PC". Media queries measure CSS pixels, so a
     1440x2560 phone at DPR 3-4 reports ~360-480 portrait and ~850 landscape —
     it would never match 1080px anyway. But hover:hover is the honest test:
     it asks whether there is a cursor, which is what a side rail actually
     needs. A phone answers hover:none however many physical pixels it has. */
  @media (min-width:1080px) and (hover:hover){
    .shell{
      display:grid;justify-content:center;align-items:start;
      /* Rails scale with the window between a floor and a ceiling instead of
         sitting at one fixed width. The floor plus the feed plus the gaps is
         1072px, which is why the breakpoint is 1080 and not 1000 — at 1000 the
         old fixed columns already totalled 1088 and the FEED was the thing
         being squeezed, since it is the only flexible track. */
      grid-template-columns:
        clamp(190px, 17vw, 250px) minmax(0,600px) clamp(230px, 21vw, 320px);
      gap:0 26px;
    }
    .rail,.cal{display:block;position:sticky;top:18px;padding-top:22px}
    .wrap{padding-top:22px}
    /* The floating bar is a PHONE control. On desktop it had nowhere to sit
       that was not on top of something, so the person filter moves into the
       rail beside the other filters and the bar goes away entirely. */
    .tabs{display:none !important}
    body.list .wrap{padding-top:22px}
  }

  /* left rail — the other pages of this hub */
  .rail h3,.cal h3{
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
    color:var(--ink-muted);margin:0 0 9px;padding-left:11px;
  }
  /* DIRECT CHILDREN ONLY. As `.rail a` these leaked into the nested project
     parts, where the active rule painted background:var(--ink) — white in dark
     mode — under text my own rule had also set to var(--ink). White on white,
     which is what the empty pill in the screenshot was. */
  .rail > a{
    display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;
    color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:550;
  }
  .rail > a:hover{background:var(--surface);color:var(--ink)}
  .rail > a[aria-current="page"]{background:var(--ink);color:var(--plane);font-weight:650}
  .rail > a i{font-style:normal;width:15px;text-align:center;font-size:12px;opacity:.75}
  .rail > a[aria-current="page"] i{opacity:1}
  .rail > .soon{opacity:.45}
  .rail > .soon:hover{background:none;color:var(--ink-2);cursor:default}
  .rail section{margin-top:20px}
  .hidedone{
    display:flex;align-items:center;gap:9px;margin:0 0 12px;padding:9px 12px;
    background:var(--surface);border:1px solid var(--ring);border-radius:10px;
    font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;
  }
  .hidedone input{width:16px;height:16px;accent-color:var(--ink);margin:0;cursor:pointer}
  .caret{
    appearance:none;border:0;background:none;cursor:pointer;font:inherit;
    color:var(--on);opacity:.6;font-size:11px;line-height:1;padding:6px 4px;flex:none;
  }
  .caret:hover{opacity:1}
  .pill.open .caret{transform:rotate(180deg)}
  .fold{background:var(--surface);padding:12px 15px 14px;color:var(--ink-2)}
  .fold .fnote{margin:0 0 10px;font-size:12.5px;color:var(--ink-muted);line-height:1.45}
  .fold ul.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  .fold ul.steps li{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:baseline}
  .fold .s{font-size:13px;line-height:1.35}
  .fold li.on .s{color:var(--ink-muted);text-decoration:line-through;text-decoration-thickness:1px}
  .fold .v{font-size:11.5px;font-weight:700;color:var(--ink-muted);font-variant-numeric:tabular-nums}
  .fold input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:var(--ink);height:18px}
  .fold .favg{margin:11px 0 0;font-size:11.5px;color:var(--ink-muted)}
  .hidedone b{margin-left:auto;font-size:11.5px;font-weight:700;opacity:.55;
              font-variant-numeric:tabular-nums}
  .ptab.proj .pg{
    flex:none;width:13px;text-align:center;font-size:10px;font-style:normal;opacity:.65;
  }
  .ptab.proj.on .pg{opacity:1}
  /* The parts of the project you are in. The connector uses --ring, not
     --rule: in dark mode --rule is #2c2c2a against a #141413 plane, which is
     invisible, so the nesting had no visible line at all. */
  .parts{
    position:relative;margin:1px 0 7px 16px;padding-left:12px;
    border-left:1.5px solid var(--ring);
  }
  .parts a{
    position:relative;display:flex;align-items:center;gap:8px;
    padding:6px 9px;border-radius:8px;
    color:var(--ink-2);text-decoration:none;font-size:12.5px;
  }
  .parts a:hover{background:var(--surface);color:var(--ink)}
  /* Active is a MARKER ON THE TREE, not a filled box. A box here fought the
     parent project's own filled pill directly above it — two solid blocks
     stacked, the child louder than the parent it belongs to. */
  .parts a[aria-current="page"]{color:var(--ink);font-weight:650}
  .parts a[aria-current="page"]::before{
    content:"";position:absolute;left:-13.5px;top:50%;transform:translateY(-50%);
    width:2px;height:15px;border-radius:1px;background:var(--ink);
  }
  .parts a[aria-current="page"] i{opacity:1}
  .parts a.soon{opacity:.4}
  .parts a.soon:hover{background:none;color:var(--ink-2);cursor:default}
  .parts a i{font-style:normal;width:13px;text-align:center;font-size:11px;opacity:.7}
  .parts .ext{margin-left:auto;font-size:10px;opacity:.5}

  /* the phone has no rail, so the type filter rides above the feed as a
     scrolling strip — and being swatch-plus-name, it is the legend too */
  .wstrip{
    display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    margin:0 -14px 12px;padding:0 14px 2px;
  }
  .wstrip::-webkit-scrollbar{display:none}
  .wstrip .wtab{
    width:auto;flex:none;padding:6px 11px;border-radius:999px;font-size:12.5px;
    background:var(--surface);border:1px solid var(--ring);white-space:nowrap;
  }
  .wstrip .wtab b,.wstrip .ptab b{margin-left:5px}
  .pstrip{margin-bottom:7px}
  .pstrip .ptab{
    width:auto;flex:none;padding:6px 11px;border-radius:999px;font-size:12.5px;
    background:var(--surface);border:1px solid var(--ring);white-space:nowrap;
  }
  /* the nested parts are a desktop affordance; the phone strip is one level */
  .pstrip .parts{display:none}
  @media (min-width:1080px) and (hover:hover){ .wstrip{display:none} }

  /* filter rows in the rail — same shape as the section links so the whole
     column reads as one list rather than three unrelated widgets */
  .wtab,.ptab{
    appearance:none;border:0;background:none;font:inherit;cursor:pointer;width:100%;
    display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:9px;
    color:var(--ink-2);font-size:13px;font-weight:550;text-align:left;
  }
  .wtab:hover,.ptab:hover{background:var(--surface);color:var(--ink)}
  .wtab.on,.ptab.on{background:var(--ink);color:var(--plane);font-weight:650}
  .wtab b,.ptab b{margin-left:auto;font-size:11px;font-weight:700;opacity:.55;
                  font-variant-numeric:tabular-nums}
  .wtab .sw,.ptab .sw{
    flex:none;width:11px;height:11px;border-radius:3px;
    background:linear-gradient(160deg,var(--a,var(--ink-muted)),var(--b,var(--ink-muted)));
  }
  .wtab .sw.all{background:linear-gradient(120deg,var(--w-script-a),var(--w-art-a) 55%,var(--w-market-a))}
  .sw.w1{--a:var(--w-script-a);--b:var(--w-script-b)}
  .sw.w2{--a:var(--w-ui-a);--b:var(--w-ui-b)}
  .sw.w3{--a:var(--w-art-a);--b:var(--w-art-b)}
  .sw.w4{--a:var(--w-market-a);--b:var(--w-market-b)}
  .sw.w0{--a:var(--w-none-a);--b:var(--w-none-b)}
  .ptab .sw{border-radius:50%;background:var(--who)}

  /* right rail — month at a glance, clicking a day jumps to it */
  .cal .mon{
    background:var(--surface);border:1px solid var(--ring);border-radius:12px;
    padding:13px 14px 14px;margin-bottom:11px;
  }
  .cal .mt{font-size:13px;font-weight:650;margin:0 0 9px;text-align:center}
  .cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font-size:10px;color:var(--ink-muted);text-align:center;font-weight:700;padding-bottom:4px}
  /* Each day is a FIELD, not a number floating in space: every cell carries a
     hairline and a fill, so the grid reads as a grid and the busy colours have
     an edge to sit inside. */
  .cal button{
    appearance:none;border:0;font:inherit;cursor:pointer;
    aspect-ratio:1;border-radius:7px;font-size:13px;font-weight:600;
    color:var(--ink-2);background:var(--plane);
    box-shadow:inset 0 0 0 1px var(--ring);
    display:flex;align-items:center;justify-content:center;position:relative;padding:0;
  }
  .cal button:disabled{color:var(--ink-muted);opacity:.3;cursor:default}
  .cal button:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--ink-muted)}
  .cal button.has{font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-muted)}
  /* a dot means work sits on that day — the number alone cannot say that */
  .cal button.has::after{
    content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--ink);
  }
  .cal button.today{background:var(--ink);color:var(--plane);font-weight:700}
  .cal button.today.has::after{background:var(--plane)}
  /* Ordered severity: free -> half -> booked. Tints rather than solid fills,
     so the day number keeps normal ink contrast at every level. */
  .cal button.b-free{background:rgba(92,129,37,.34)}
  .cal button.b-half{background:rgba(232,189,34,.46)}
  .cal button.b-full{
    background:repeating-linear-gradient(135deg,
      rgba(192,58,58,.55) 0 4px, rgba(192,58,58,.28) 4px 8px);
    color:var(--ink);
  }
  .cal button.today{background:var(--ink);color:var(--plane);font-weight:800;
                    box-shadow:inset 0 0 0 2px var(--ink)}
  .blegend{display:flex;flex-wrap:wrap;gap:4px 11px;padding:6px 2px 2px;
           font-size:10.5px;color:var(--ink-muted)}
  .blegend span{display:inline-flex;align-items:center;gap:5px}
  .blegend .bs{width:10px;height:10px;border-radius:3px;flex:none}
  .blegend .bs.b-free{background:rgba(92,129,37,.55)}
  .blegend .bs.b-half{background:rgba(232,189,34,.75)}
  .blegend .bs.b-full{background:repeating-linear-gradient(135deg,
    rgba(192,58,58,.85) 0 3px, rgba(192,58,58,.4) 3px 6px)}
  .cal .key{font-size:10.5px;color:var(--ink-muted);padding:2px 2px 0;line-height:1.7}
  .cal .key b{color:var(--ink-2);font-weight:600}

  /* rename-in-place: the input replaces the label, inheriting its box so the
     chip does not resize or jump when editing starts */
  .lbl input{
    width:100%;font:inherit;font-size:inherit;font-weight:inherit;color:inherit;
    background:rgba(0,0,0,.22);border:0;border-radius:6px;
    padding:3px 7px;margin:-3px 0;outline:1px solid rgba(255,255,255,.35);
    user-select:text;-webkit-user-select:text;
  }
  /* ---------------- drag ----------------
     Pointer events, not HTML5 drag-and-drop, which has no touch support at
     all. Two ways in, on purpose: the grip commits immediately because
     touch-action:none stops the browser claiming the gesture, while a
     press-and-hold anywhere on the chip waits out 240ms so a flick still
     scrolls the page. Without that split the feed would be unscrollable. */
  .grip{
    flex:none;margin:0 -4px 0 -6px;padding:0 5px;align-self:stretch;
    display:flex;align-items:center;cursor:grab;touch-action:none;
    color:var(--on);opacity:.45;font-size:12px;line-height:1;
  }
  .grip:hover{opacity:.9}
  .grip:active{cursor:grabbing}
  .pill.lifted{opacity:.3}
  body.dragging{user-select:none;-webkit-user-select:none;touch-action:none;cursor:grabbing}
  #ghost{
    position:fixed;z-index:120;pointer-events:none;left:0;top:0;
    border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:.97;
  }
  .day.over>.slot{
    background:var(--drop,rgba(41,118,210,.10));
    border-radius:10px;outline:1.5px dashed var(--gw-a);outline-offset:2px;
  }
  .addhere{
    appearance:none;border:0;background:none;cursor:pointer;font:inherit;
    color:var(--ink-muted);font-size:16px;line-height:1;padding:2px 6px;
    border-radius:7px;opacity:0;transition:opacity .12s;
  }
  .dh:hover .addhere,.addhere:focus{opacity:1}
  .addhere:hover{background:var(--surface);color:var(--ink)}
  /* touch has no hover, so the button cannot hide behind one */
  @media (hover:none){ .addhere{opacity:.55} }

  .composer{
    background:var(--surface);border:1px solid var(--ring);border-radius:14px;
    padding:11px 12px;display:flex;flex-direction:column;gap:8px;
  }
  .composer input[name="t"]{
    font:inherit;font-size:14px;color:var(--ink);background:none;border:0;
    outline:0;padding:3px 2px;
  }
  .composer .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .composer select{
    font:inherit;font-size:12px;color:var(--ink-2);background:var(--plane);
    border:1px solid var(--ring);border-radius:7px;padding:5px 7px;
  }
  .composer button{
    font:inherit;font-size:12px;cursor:pointer;border:0;border-radius:7px;
    padding:6px 12px;background:var(--ink);color:var(--plane);font-weight:650;
  }
  .composer button.x{background:none;color:var(--ink-muted);margin-left:auto;font-weight:500}
  .wtab.addtype{color:var(--ink-muted)}
  .wtab .sw.plus{
    display:flex;align-items:center;justify-content:center;background:none;
    border:1px dashed var(--rule);color:var(--ink-muted);font-size:10px;line-height:1;
  }
  .typemaker{
    margin:4px 0 4px 11px;padding:9px 10px;border-radius:10px;
    background:var(--surface);border:1px solid var(--ring);
    display:flex;flex-direction:column;gap:7px;
  }
  .typemaker input[name="name"]{
    font:inherit;font-size:12.5px;color:var(--ink);background:none;border:0;outline:0;
  }
  .typemaker .slots{display:flex;gap:7px}
  .typemaker .slots input{position:absolute;opacity:0;pointer-events:none}
  .typemaker .slots label{cursor:pointer;padding:2px;border-radius:6px;border:1.5px solid transparent}
  .typemaker .slots label:has(input:checked){border-color:var(--ink)}
  .typemaker .slots .sw{width:15px;height:15px;border-radius:4px}
  .typemaker .row{display:flex;gap:6px;align-items:center}
  .typemaker button{
    font:inherit;font-size:11.5px;cursor:pointer;border:0;border-radius:6px;
    padding:5px 10px;background:var(--ink);color:var(--plane);font-weight:650;
  }
  .typemaker button.x{background:none;color:var(--ink-muted);margin-left:auto;font-weight:500}
  .day.jump{animation:jump 1.1s ease-out}
  @keyframes jump{0%,22%{background:var(--drop,rgba(41,118,210,.14))}100%{background:transparent}}
  .stash{
    margin:14px 0 0;padding:10px 13px;border-radius:10px;
    background:var(--surface);border:1px solid var(--ring);
    font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center;
  }
  .stash b{color:var(--ink);font-weight:650}
  .stash button{
    margin-left:auto;appearance:none;font:inherit;font-size:12px;cursor:pointer;
    background:var(--ink);color:var(--plane);border:0;border-radius:7px;padding:5px 10px;
  }
  /* Only the list makes room for the floating tabs — the detail page hides
     them, and reserving the space there would leave a hole above the title. */
  body.list .wrap{padding-top:calc(64px + env(safe-area-inset-top))}

  /* ---------------- who filter ---------------- */
  .tabs{
    position:fixed;z-index:20;
    top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;gap:2px;padding:4px;border-radius:999px;
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 2px 14px rgba(11,11,11,.13), inset 0 0 0 1px var(--glass-ring);
  }
  .tabs[hidden]{display:none}
  .tab{
    appearance:none;border:0;background:none;cursor:pointer;font:inherit;
    display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
    font-size:12.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-pressed="true"]{background:var(--ink);color:var(--plane)}
  .tab .n{font-size:10.5px;font-weight:700;opacity:.6;font-variant-numeric:tabular-nums}
  .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--who)}

  .empty{text-align:center;color:var(--ink-muted);font-size:14px;padding:40px 10px}
  .empty b{color:var(--ink-2)}

  /* ---------------- day block ---------------- */
  .day{margin-bottom:14px}
  .dh{display:flex;align-items:baseline;gap:8px;padding:6px 4px 7px;
      border-bottom:1px solid var(--rule)}
  .dh .dd{font-size:13px;font-weight:650;color:var(--ink-2);letter-spacing:-.01em}
  .dh .dw{font-size:11.5px;color:var(--ink-muted)}
  .dh .note{margin-left:auto;font-size:11px;color:var(--ink-muted);text-align:right}
  .slot{padding-top:8px;display:flex;flex-direction:column;gap:7px}
  .slot:empty::after{content:"—";color:var(--ink-muted);opacity:.35;font-size:12px;padding-left:4px}

  .day.now{margin:6px 0 20px}

  /* ---------------- chip ---------------- */
  .pill{
    --p:0%;
    /* a chip is a button, and buttons do not get text-selected — without this
       a double-click to rename highlights the label first */
    user-select:none;-webkit-user-select:none;
    /* A FIXED radius, not 999px. Half the minor height, so a minor chip is
       still a perfect pill while taller ones keep the same corner and read as
       rectangles — the size difference then shows as shape, not just height. */
    border-radius:22px;overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.07);
    background:
      linear-gradient(90deg,
        rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--p),
        var(--rest) var(--p), var(--rest) 100%),
      linear-gradient(170deg,var(--a),var(--b));
    transition:filter .12s;
  }
  /* fill = WORK TYPE; the project is the glyph */
  .w1{--a:var(--w-script-a); --b:var(--w-script-b)}
  .w2{--a:var(--w-ui-a);     --b:var(--w-ui-b)}
  .w3{--a:var(--w-art-a);    --b:var(--w-art-b); --on:#141413}
  .w4{--a:var(--w-market-a); --b:var(--w-market-b)}
  .w0{--a:var(--w-none-a);   --b:var(--w-none-b)}
  /* the bright yellow needs its own ring — a light chip on a near-white page
     has only 1.73:1 of edge, so the border does the work the fill cannot */
  .w3{box-shadow:var(--shadow), inset 0 0 0 1px rgba(11,11,11,.22)}
  .cat-gw   {--a:var(--gw-a);    --b:var(--gw-b)}
  .cat-admin{--a:var(--admin-a); --b:var(--admin-b)}
  .cat-site {--a:var(--site-a);  --b:var(--site-b)}
  .cat-park {--a:var(--park-a);  --b:var(--park-b)}
  .pill:hover{filter:brightness(1.06)}

  /* SIZE — height is the encoding. Magnitude read as magnitude, legible while
     scrolling past. The word also appears on the detail page, so weight is
     never carried by height alone. */

       color:var(--on);min-height:44px}
  .sz-moderate .top{min-height:56px}

  .sz-major    .lbl{font-size:15.5px;font-weight:600}

  /* A PROCESS has no finish, so its bar cannot mean completion. The stripes
     say "this cycles" at a glance, and the filled part is how far through the
     current cycle it is — full means due. Same grammar, different meaning. */

/* ==========================================================
   PROCESSES — work with no finish. No pct and no "done when";
   they are measured by RECENCY instead.
     every   the rhythm, as a label
     last    when it last happened
     next    when it is next due ("" = continuous, no due date)
     from    "launch" = does not start until the game ships
   ========================================================== */

  {id:"reviews", work:"market", cat:"gw", size:"moderate", t:"Reply to store reviews",
   every:"continuous", last:"", next:"", from:"launch",
   healthy:"No review sits more than a couple of days without a reply.",

const DAYNOTES = {
  "2026-08-09":"shift night", "2026-08-10":"desk day", "2026-08-11":"desk day",
  "2026-08-12":"shift night", "2026-08-13":"desk day · rota out", "2026-08-14":"desk day",
  "2026-08-29":"ship decision", "2026-09-05":"hard wall"
};
const HORIZON = 21;

/* HOW BUSY A DAY IS — a three-step scale, not four categories, which is why
   green/amber/red is the right encoding here: it is ordered severity and the
   traffic light is the one place that convention is genuinely universal.
   Colour is still not alone — "full" is hatched, and the legend names each. */
const BUSY = [
  {from:"2026-09-15", to:"2026-09-29", level:"full", what:"Greece"},
  {from:"2026-09-30", to:"2026-10-24", level:"half", what:"Farm season"}
];
/* A shift night is HALF: he is at the warehouse, but he has a phone, and the
   whole phone-task queue exists because those hours are usable. Calling them
   full would hide six hours a week he actually works in. */
function busyOf(d){
  for (const r of BUSY) if (d >= r.from && d <= r.to) return r.level;
  const note = (DAYNOTES[d] || "").toLowerCase();
  if (note.includes("shift")) return "half";
  return "free";
}
const BUSY_LABEL = {free:"Free", half:"Half busy", full:"Booked"};

const GLYPH = {gw:"●", admin:"◆", site:"▲", park:"○"};
const CATS  = {gw:"Guess When", admin:"Admin", site:"Sites", park:"Parked"};
/* Donis's four, plus a neutral. The four are all game-dev, so admin, tax,
   security and farm work genuinely has no type — those stay grey rather than
   being forced into a box that does not fit. */
const WORKS = {
  /* Four COLOUR SLOTS, reused by every project. The palette only holds four
     that stay separable, so a fifth global colour would not be readable —
     instead each project maps its own types onto the same four, and the
     project GLYPH disambiguates: a slot-1 chip with ● is Guess When scripting,
     a slot-1 chip with ◆ is admin tax work. Colour plus shape is how a
     categorical palette legitimately goes past its own limit. */
  script:{name:"Scripting",   slot:1},
  ui:    {name:"UI / UX",     slot:2},
  art:   {name:"Graphical",   slot:3},
  market:{name:"Marketing",   slot:4},

  tax:   {name:"Tax & filing", slot:1},
  legal: {name:"Paperwork",    slot:2},
  sec:   {name:"Security",     slot:3},
  job:   {name:"Job & rota",   slot:4},

  build: {name:"Build & deploy", slot:1},
  copy:  {name:"Copy & content", slot:2},

  none:  {name:"Other",        slot:0}
};
/* which types each project actually offers — the composer and the filter show
   only these, so you cannot file a farm task as "Battlepass" */
const PROJECT_WORKS = {
  gw:    ["script","ui","art","market"],
  admin: ["tax","legal","sec","job"],
  site:  ["ui","copy","build"],
  park:  ["script","ui","art","market"]
};
const worksFor = pf => pf !== "all" && PROJECT_WORKS[pf]
  ? PROJECT_WORKS[pf]
  : [...new Set(Object.values(PROJECT_WORKS).flat())];
const slotOf = w => (WORKS[w] || WORKS.none).slot;

/* PEOPLE — the colour lives in CSS as .who-<id>, the same split the categories
   already use: JS holds the structure, CSS holds the palette. Adding a third
   person is one line here and one line there.
   A row with no `who` belongs to DEFAULT_WHO. This list was one person's before
   it was two, so spelling the default onto every row would only make the rows
   that DO differ harder to spot. */
const PEOPLE = {
  don:  {name:"Don",  initial:"D"},
  anna: {name:"Anna", initial:"A"}
};
const DEFAULT_WHO = "don";
const whoOf = t => PEOPLE[t.who] ? t.who : DEFAULT_WHO;
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const TODAY = iso(new Date());
const TOMORROW = addDays(TODAY,1);
const BY_ID = Object.fromEntries([...TASKS, ...PROCESSES].map(t => [t.id,t]));
const IS_PROC = Object.fromEntries(PROCESSES.map(p => [p.id,true]));
const days = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);

/* A process is judged on recency, not completion. The bar shows how far
   through the current cycle it is: full means due now. */
function procState(p){
  if (p.from === "launch") return {label:"at launch", pct:0, cls:"", when:"Not started"};
  if (!p.next) return {label:"ongoing", pct:100, cls:"", when:"Continuous"};
  const left = days(TODAY, p.next);
  const span = p.last ? Math.max(1, days(p.last, p.next)) : 1;
  const pct  = Math.max(0, Math.min(100, Math.round((span - left) / span * 100)));
  if (left < 0)  return {label:"overdue " + (-left) + "d", pct:100, cls:"over",
                         when:"Overdue by " + (-left) + " days"};
  if (left === 0) return {label:"due today", pct:100, cls:"due", when:"Due today"};
  return {label:"due in " + left + "d", pct, cls: left <= 2 ? "due" : "",
          when:"Due in " + left + " days"};
}
// "blocks" is the inverse of needs — derived, so the two can never disagree
const BLOCKS = {};
for (const t of TASKS) for (const n of (t.needs||[])) (BLOCKS[n] ||= []).push(t.id);

const paintPct = p => p === 0 ? 12 : Math.max(0, Math.min(100,p));

/* ---------------- renames ----------------
   A rename lives in localStorage, not in the file, because the page is static
   and there is nothing to POST to. That makes it DEVICE-LOCAL: real on this
   browser, invisible everywhere else. The stash banner exists so that is never
   a silent surprise — it shows the count and hands over the line to paste into
   TASKS, which is the only thing that makes a rename permanent. */
const EDITS_KEY = "edits.v1";
let EDITS = {names:{}, dates:{}};
try {
  const saved = JSON.parse(localStorage.getItem(EDITS_KEY) || "null");
  if (saved) EDITS = {names: saved.names || {}, dates: saved.dates || {}};
  else {                                     // carry over the first-cut rename store
    const old = JSON.parse(localStorage.getItem("renames.v1") || "null");
    if (old) EDITS.names = old;
  }
} catch(e){}
if (!Array.isArray(EDITS.added)) EDITS.added = [];
if (!EDITS.works)     EDITS.works = {};      // types he defined himself
if (!EDITS.projWorks) EDITS.projWorks = {};  // and which project offers them
Object.assign(WORKS, EDITS.works);
for (const [pf,list] of Object.entries(EDITS.projWorks))
  PROJECT_WORKS[pf] = [...new Set([...(PROJECT_WORKS[pf] || []), ...list])];
/* A task you added is pushed into TASKS itself rather than kept in a parallel
   list. Everything downstream — filters, counts, the calendar, drag, rename,
   the detail route — then works on it for free, instead of each one needing to
   learn about a second source of tasks. */
for (const t of EDITS.added){ TASKS.push(t); BY_ID[t.id] = t; }
const saveEdits = () => { try { localStorage.setItem(EDITS_KEY, JSON.stringify(EDITS)); } catch(e){} };

function newId(title){
  const base = (title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "task").slice(0,18);
  let id = base, n = 2;
  while (BY_ID[id]) id = base + "-" + n++;      // ids are the routing key, so they must not collide
  return id;
}
function addTask(d, fields){
  const t = {id:newId(fields.t), d, cat:fields.cat, work:fields.work,
             size:fields.size, pct:0, t:fields.t, who:fields.who, _new:true};
  EDITS.added.push(t); TASKS.push(t); BY_ID[t.id] = t;
  saveEdits();
}

const titleOf = t => EDITS.names[t.id] || t.t;
const dateOf  = t => (t.id in EDITS.dates) ? EDITS.dates[t.id] : t.d;
if (!EDITS.steps) EDITS.steps = {};
/* A step now carries its OWN percentage, and the task's number is the average
   of them. Seeded from the old done/not-done flag so nothing starts blank.
   Deriving beats authoring: a hand-typed 60% next to three untouched steps was
   a guess, and the steps are the thing he actually knows about. */
function stepPct(t, i){
  const row = EDITS.steps[t.id];
  if (row && row[i] !== undefined && row[i] !== null) return +row[i];
  return (t.sub && t.sub[i] && t.sub[i][1]) ? 100 : 0;
}
function setStepPct(t, i, v){
  const n = (t.sub || []).length;
  const row = EDITS.steps[t.id] || (EDITS.steps[t.id] = Array.from({length:n}, (_, k) => stepPct(t, k)));
  row[i] = Math.max(0, Math.min(100, Math.round(v)));
  saveEdits();
}
function taskPct(t){
  const n = (t.sub || []).length;
  if (!n) return Math.max(0, Math.min(100, t.pct));
  let sum = 0;
  for (let i = 0; i < n; i++) sum += stepPct(t, i);
  return Math.round(sum / n);
}

const editCount = () => Object.keys(EDITS.names).length + Object.keys(EDITS.dates).length +
                        EDITS.added.length + Object.keys(EDITS.works).length;

function setTitle(id, text){
  const orig = BY_ID[id]; if (!orig) return;
  const clean = text.trim();
  if (!clean || clean === orig.t) delete EDITS.names[id];   // back to the original = not an edit
  else EDITS.names[id] = clean;
  saveEdits();
}
function setDate(id, d){
  const orig = BY_ID[id]; if (!orig) return;
  if (d === orig.d) delete EDITS.dates[id];
  else EDITS.dates[id] = d;
  saveEdits();
}

function avatar(t){
  const id = whoOf(t), p = PEOPLE[id];
  return '<span class="who who-' + id + '" title="' + esc(p.name) + '">' +
         esc(p.initial) + "</span>";
}
const ownerTag = t =>
  '<span class="tag"><span class="dot who-' + whoOf(t) + '"></span>' +
  esc(PEOPLE[whoOf(t)].name) + "</span>";

function chip(t){
  if (IS_PROC[t.id]){
    const s = procState(t);
    return '<article class="pill proc ' + s.cls + " cat-" + t.cat + " w" + slotOf(t.work) + " sz-" + t.size +
             '" style="--p:' + s.pct + '%"><div class="top">' +
        '<span class="glyph" aria-hidden="true">↻</span>' +
        '<span class="lbl">' + esc(titleOf(t)) + "</span>" +
        '<span class="cyc">' + s.label + "</span>" +
        avatar(t) +
        '<a class="go" href="#/t/' + t.id + '" aria-label="Open ' + esc(titleOf(t)) + '">›</a>' +
      "</div></article>";
  }
  const pct = taskPct(t);
  return '<article class="pill cat-' + t.cat + " w" + slotOf(t.work) + " sz-" + t.size +
           '" style="--p:' + paintPct(pct) + '%">' +
      '<div class="top">' +
        '<span class="grip" aria-hidden="true" title="Drag to another day">⠿</span>' +
        '<span class="glyph" aria-hidden="true">' + GLYPH[t.cat] + "</span>" +
        '<span class="lbl">' + esc(titleOf(t)) + "</span>" +
        '<span class="pct">' + pct + "%</span>" +
        avatar(t) +
        ((t.sub && t.sub.length) || t.note
          ? '<button class="caret" data-fold="' + t.id + '" aria-label="Show steps">▾</button>' : "") +
        '<a class="go" href="#/t/' + t.id + '" aria-label="Open ' + esc(titleOf(t)) + '">›</a>' +
      "</div>" + foldHTML(t) + "</article>";
}

/* The foldout is a THIRD way into a task, beside the full page and the chip
   itself, so it needs its own affordance: the caret. Reusing a click on the
   body would collide with double-click-to-rename, and reusing the chevron
   would take away the only route to the full page. */
const OPEN = new Set();
function foldHTML(t){
  if (!OPEN.has(t.id)) return "";
  const sub = t.sub || [];
  const rows = sub.map((x, i) => {
    const v = stepPct(t, i);
    return '<li' + (v >= 100 ? ' class="on"' : "") + '>' +
      '<span class="s">' + esc(x[0]) + "</span>" +
      '<span class="v" data-v="' + t.id + "." + i + '">' + v + "%</span>" +
      '<input type="range" min="0" max="100" step="5" value="' + v +
        '" data-step="' + t.id + "." + i + '" aria-label="' + esc(x[0]) + '"></li>';
  }).join("");
  return '<div class="fold">' +
    (t.note ? '<p class="fnote">' + esc(t.note) + "</p>" : "") +
    (rows ? "<ul class=\"steps\">" + rows + "</ul>" +
       '<p class="favg">Task percentage is the average of its steps.</p>' : "") +
    "</div>";
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-fold]");
  if (!b) return;
  const id = b.dataset.fold;
  OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id);
  route();
});

/* Updated IN PLACE rather than by re-rendering: a route() on every slider
   movement would rebuild the DOM under the thumb and drop the drag. */
document.addEventListener("input", e => {
  const r = e.target.closest("[data-step]");
  if (!r) return;
  const [id, i] = r.dataset.step.split(".");
  const t = BY_ID[id]; if (!t) return;
  setStepPct(t, +i, +r.value);
  const pct = taskPct(t);
  const li = r.closest("li");
  li.classList.toggle("on", +r.value >= 100);
  li.querySelector(".v").textContent = r.value + "%";
  const pill = r.closest(".pill");
  pill.style.setProperty("--p", (pct === 0 ? 12 : pct) + "%");
  const out = pill.querySelector(".pct");
  if (out) out.textContent = pct + "%";
  pill.classList.toggle("done", pct >= 100);
});

/* ---------------- who filter ----------------
   Kept in localStorage rather than the hash: the hash is the ROUTE, and a
   filter that travelled in a link would mean sending somebody a page with
   half the work silently missing. */
let FILTER = "all";
try { FILTER = localStorage.getItem("who") || "all"; } catch(e){}
if (FILTER !== "all" && !PEOPLE[FILTER]) FILTER = "all";
/* Hiding done work is a VIEW, not a filter on the data — the counts and the
   percentages still describe everything, because a board that quietly stopped
   counting finished work would make progress unreadable. */
let HIDEDONE = false;
try { HIDEDONE = localStorage.getItem("hidedone") === "1"; } catch(e){}
const isDone = t => (t.pct !== undefined) ? taskPct(t) >= 100 : false;

/* Rolling overdue work forward is a VIEW. It does NOT rewrite the stored date:
   a board that silently moved dates would destroy the evidence of what slipped
   and when, which is the one thing the log exists to keep. Turn it off and the
   real dates are all still there. */
let ROLL = false;
try { ROLL = localStorage.getItem("roll") === "1"; } catch(e){}

/* A day you cannot work is not a day to roll onto. Shift nights and away days
   are skipped, so overdue work lands on the next day he could actually do it. */
/* One definition of "can he work on this day", shared with the calendar
   colours. Anything not free is skipped: rolling a desk task onto a shift
   night or onto Greece only moves the lie forward. */
const dayBlocked = d => busyOf(d) !== "free";
function nextOpenDay(from){
  let d = from;
  for (let i = 0; i < 60; i++){          // bounded: never loop looking for a free day
    if (!dayBlocked(d)) return d;
    d = addDays(d, 1);
  }
  return from;
}
const rollTo = () => nextOpenDay(TODAY);

let WFILTER = "all";
try { WFILTER = localStorage.getItem("work") || "all"; } catch(e){}
if (WFILTER !== "all" && !WORKS[WFILTER]) WFILTER = "all";

/* Both axes AND together. Independent filters that silently replaced each
   other would make the empty state a lie. */
const mine = t => (FILTER === "all"  || whoOf(t) === FILTER)
               && (WFILTER === "all" || (t.work || "none") === WFILTER)
               && (PFILTER === "all" || t.cat === PFILTER);

/* Counts are OPEN work only. Counting everything would make a person's number
   grow as they finished things, which is backwards. */
function openCount(id){
  const pick = x => id === "all" || whoOf(x) === id;
  return TASKS.filter(x => pick(x) && x.pct < 100).length +
         PROCESSES.filter(x => pick(x) && x.from !== "launch").length;
}

/* Open work only, and the SAME rule openCount uses, so the two filter axes
   never disagree about what "open" means. Counts also respect the person
   filter, so switching to Anna renumbers the types under her. */
function workCount(w){
  const hit = t => (FILTER === "all" || whoOf(t) === FILTER) &&
                   (w === "all" || (t.work || "none") === w);
  return TASKS.filter(x => hit(x) && x.pct < 100).length +
         PROCESSES.filter(x => hit(x) && x.from !== "launch").length;
}
/* This IS the legend. A separate colour key would be a second thing to keep in
   step with the filter; one control that shows the swatch beside the name
   cannot drift out of date. */
function workButtons(){
  const list = worksFor(PFILTER);
  return ["all", ...list, "none"].map(w =>
    '<button class="wtab' + (WFILTER === w ? " on" : "") + '" data-work="' + w + '">' +
      (w === "all" ? '<i class="sw all"></i>' : '<i class="sw w' + slotOf(w) + '"></i>') +
      "<span>" + esc(w === "all" ? "Everything" : (WORKS[w] ? WORKS[w].name : w)) + "</span>" +
      '<b>' + workCount(w) + "</b></button>").join("") +
    (PFILTER === "all" ? "" :
      '<button class="wtab addtype" data-addtype="1"><i class="sw plus">+</i>' +
      "<span>Add a type</span></button>");
}
function renderWorks(into){ into.innerHTML = "<h3>Work type</h3>" + workButtons(); }

function rollToggle(){
  const landing = rollTo();
  const n = TASKS.filter(t => mine(t) && dateOf(t) && dateOf(t) < TODAY && !isDone(t)).length;
  const where = landing === TODAY ? "today"
    : (parse(landing).getDate() + " " + MO[parse(landing).getMonth()]);
  return '<label class="hidedone"><input type="checkbox" id="roll"' +
    (ROLL ? " checked" : "") + '><span>Roll overdue to ' + where + "</span>" +
    "<b>" + n + "</b></label>";
}
document.addEventListener("change", e => {

  ROLL = e.target.checked;

  route();
});

function doneToggle(){

}
document.addEventListener("change", e => {

  HIDEDONE = e.target.checked;

  route();
});
document.addEventListener("click", e => {

const tabsEl = document.getElementById("tabs");
function renderTabs(){
  tabsEl.innerHTML = ["all", ...Object.keys(PEOPLE)].map(id =>
    '<button class="tab" type="button" data-who="' + id + '" aria-pressed="' +

/* Delegated from the document, and matching [data-who] rather than one class:
   the person filter exists in TWO places — the floating bar on a phone and the
   rail on a desktop — and binding to the bar meant the rail buttons did
   nothing at all on the machine he actually uses. route() re-renders
   everything, so the counts, calendar and toggles move with it; the old
   partial re-render also quietly dropped the banner and the strips. */
document.addEventListener("click", e => {

  if (!b || b.dataset.who === FILTER) return;
  FILTER = b.dataset.who;

  scrollTo(0,0);
});

/* ---------------- list view ---------------- */
function listView(){
  /* Filtering happens ONCE, here at the source. Everything downstream — the
     empty-day runs, the history block, the undated section — then collapses on
     its own, with no second idea of what is visible. */
  const tasks = TASKS.filter(mine).filter(t => !(HIDEDONE && isDone(t)));
  const landing = rollTo();
  // where a task DISPLAYS, which is not always where it is dated
  const shownDay = t => (ROLL && dateOf(t) && dateOf(t) < TODAY && !isDone(t))
    ? landing : dateOf(t);

  /* Processes sit below the timeline rather than on a day — they are not
     scheduled, they are kept up. Overdue and due-soon float to the top of
     their own section so upkeep slipping is still visible. */
  const rank = p => { const s = procState(p);
    return s.cls === "over" ? 0 : s.cls === "due" ? 1 : p.from === "launch" ? 3 : 2; };
  const ongoing = PROCESSES.filter(mine).sort((a,b) => rank(a) - rank(b));

  if (!tasks.length && !ongoing.length)
    return '<div class="empty">Nothing assigned to <b>' +
           esc(PEOPLE[FILTER].name) + "</b> yet.</div>";

  const byDay = {};
  for (const t of tasks) (byDay[shownDay(t)] ||= []).push(t);

  function block(d, cls){
    const dt = parse(d), note = DAYNOTES[d];
    const flag = d === TODAY ? '<span class="flag">Today</span>'
               : d === TOMORROW ? '<span class="flag">Tomorrow</span>' : "";
    // data-d is the anchor the calendar jumps to
    return '<section class="day ' + cls + '" data-d="' + d + '"><div class="dh">' +
      '<span class="dd">' + dt.getDate() + " " + MO[dt.getMonth()] + "</span>" +
      '<span class="dw">' + WD[dt.getDay()] + "</span>" + flag +
      (note ? '<span class="note">' + note + "</span>" : "") +
      '<button class="addhere" data-add="' + d + '" title="Add a task here">+</button>' + "</div>" +
      '<div class="slot">' + (byDay[d] || []).map(chip).join("") + "</div></section>";
  }
  function rangeLabel(a,b){
    const x = parse(a), y = parse(b);
    const left = x.getDate() + (x.getMonth() === y.getMonth() ? "" : " " + MO[x.getMonth()]);
    return a === b ? x.getDate()+" "+MO[x.getMonth()]
                   : left + " – " + y.getDate() + " " + MO[y.getMonth()];
  }
  const gapRow = run => '<div class="gap"><span class="r">' +
    rangeLabel(run[0], run[run.length-1]) + "</span><span>" +
    (run.length === 1 ? WD[parse(run[0]).getDay()] : run.length + " days") +
    '</span><span class="n">clear</span></div>';

  const past = Object.keys(byDay).filter(d => d && d < TODAY).sort();
  let last = addDays(TODAY, HORIZON);
  for (const d in byDay)    if (d && d > last) last = d;
  for (const d in DAYNOTES) if (d > last) last = d;

  let html = "";
  if (past.length) html += '<div class="hist">History</div>' +
    past.map(d => block(d,"past")).join("") + '<hr class="rule">';

  let run = [];
  for (let d = TODAY; d <= last; d = addDays(d,1)){
    const pinned = (d === TODAY || d === TOMORROW);
    const empty  = !(byDay[d] || []).length && !DAYNOTES[d];
    if (empty && !pinned){ run.push(d); continue; }
    if (run.length){ html += gapRow(run); run = []; }
    html += block(d, d === TODAY ? "now" : d === TOMORROW ? "next" : "");
  }
  if (run.length) html += gapRow(run);

  if (byDay[""]) html += '<hr class="rule"><div class="hist">No date</div>' +
    '<div class="slot">' + byDay[""].map(chip).join("") + "</div>";

  if (ongoing.length)
    html += '<hr class="rule"><div class="hist">Ongoing · no finish</div>' +
            '<div class="slot">' + ongoing.map(chip).join("") + "</div>";
  return html;
}

/* ---------------- detail view ---------------- */
function depChip(id){
  const t = BY_ID[id];
  if (!t) return "";
  return '<article class="pill cat-' + t.cat + ' sz-minor" style="--p:' +
    paintPct(t.pct) + '%"><div class="top">' +
    '<span class="glyph" aria-hidden="true">' + GLYPH[t.cat] + "</span>" +
    '<span class="lbl">' + esc(titleOf(t)) + "</span>" +
    '<span class="pct">' + t.pct + "%</span>" +
    avatar(t) +

function processView(p){
  const s = procState(p);
  const sec = (title, inner, flush) =>
    '<div class="sec"><h2>' + title + '</h2>' +
    (flush ? '<div class="card pad0">' + inner + "</div>" : inner) + "</div>";

  let h = '<a class="back" href="#/">‹ All tasks</a>' +
    '<div class="cat-' + p.cat + '">' +
    '<h1 class="dtitle">' + esc(titleOf(p)) + "</h1>" +
    '<div class="dmeta">' +
      '<span class="tag fill">↻ Process</span>' +
      ownerTag(p) +
      '<span class="tag">' + esc(p.every) + "</span>" +
      '<span class="tag">' + p.size + "</span>" +
      '<span class="tag">' + s.when + "</span>" +
    "</div>" +
    '<div class="bar"><i style="width:' + s.pct + '%"></i></div>' +
    "</div>";

  // no "done when" — a process cannot be finished, only kept up
  if (p.healthy) h += sec("Healthy when", '<div class="card">' + esc(p.healthy) + "</div>");
  if (p.note)    h += sec("Why", '<div class="card">' + esc(p.note) + "</div>");

  h += sec("Rhythm", '<div class="log">' +
    "<div><b>Every</b>" + esc(p.every) + "</div>" +

                                 : "never") + "</div>" +

function detailView(t){
  if (IS_PROC[t.id]) return processView(t);

    ? (td === TODAY ? "Today" : td === TOMORROW ? "Tomorrow"
       : WD[parse(td).getDay()] + " " + parse(td).getDate() + " " + MO[parse(td).getMonth()])
    : "No date";
  const blocks = BLOCKS[t.id] || [];
  const sec = (title, inner, flush) =>

  if (t.note) h += sec("Why", '<div class="card">' + esc(t.note) + "</div>");

  if ((t.needs||[]).length){

    h += sec("Blocked by" + (open.length ? "" : " — all clear"),

    h += sec("Blocks", '<div class="dep">' + blocks.map(depChip).join("") + "</div>");

  if ((t.sub||[]).length)
    h += sec("Steps", '<ul class="steps">' + t.sub.map(s =>
      '<li class="' + (s[1] ? "on" : "") + '"><span class="box">✓</span><span>' +
      esc(s[0]) + "</span></li>").join("") + "</ul>", true);

  if ((t.links||[]).length)
    h += sec("Links", '<div class="links">' + t.links.map(l =>
      '<a href="' + l[1] + '" target="_blank" rel="noopener">' + esc(l[0]) + " ↗</a>").join("") + "</div>", true);

  if ((t.log||[]).length)
    h += sec("Log", '<div class="log">' + t.log.slice().reverse().map(e =>
      "<div><b>" + e[0] + "</b>" + esc(e[1]) + "</div>").join("") + "</div>", true);

  return h;
}

/* ---------------- right rail: the month ----------------
   Two months, because the ship date is usually in the next one. A dot marks a
   day that holds work; clicking jumps to that day in the feed. */
function renderCal(){
  const byDay = {};
  for (const t of TASKS.filter(mine)) if (dateOf(t)) (byDay[dateOf(t)] ||= []).push(t);

  let html = "<h3>Calendar</h3>";
  const start = parse(TODAY);
  // Two months. October's farm block is therefore off the end of this view —
  // it is still coloured in the day headers of the feed itself.
  for (let k = 0; k < 2; k++){
    const y = start.getFullYear(), m = start.getMonth() + k;
    const first = new Date(y, m, 1), total = new Date(y, m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;                    // Monday-first
    html += '<div class="mon"><p class="mt">' + MO[first.getMonth()] + " " + first.getFullYear() +
      '</p><div class="grid">' +
      ["M","T","W","T","F","S","S"].map(d => '<div class="dow">' + d + "</div>").join("") +
      '<div style="grid-column:span ' + (lead || 7) + '"></div>'.repeat(lead ? 1 : 0);
    for (let n = 1; n <= total; n++){
      const key = first.getFullYear() + "-" + pad(first.getMonth()+1) + "-" + pad(n);
      const cls = [byDay[key] ? "has" : "", key === TODAY ? "today" : "",
                 "b-" + busyOf(key)].filter(Boolean).join(" ");
      const n2 = (byDay[key] || []).length;
      const bl = BUSY_LABEL[busyOf(key)];
      const tip = (n2 ? n2 + " task" + (n2>1?"s":"") + " · " : "") + bl;
      html += '<button data-d="' + key + '" class="' + cls + '" title="' + tip + '">' +
        n + "</button>";
    }
    html += "</div></div>";
  }
  html += '<div class="blegend">' +
    ["free","half","full"].map(l => '<span><i class="bs b-' + l + '"></i>' +
      BUSY_LABEL[l] + "</span>").join("") + "</div>" +
    '<p class="key"><b>•</b> a day holding work · <b>tap</b> to jump to it</p>';
  document.getElementById("cal").innerHTML = html;
}
document.getElementById("cal").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  if (location.hash && location.hash !== "#/") { location.hash = "#/"; }
  requestAnimationFrame(() => {
    const sec = document.querySelector('.day[data-d="' + b.dataset.d + '"]');
    if (!sec) return;
    sec.scrollIntoView({block:"center", behavior:"smooth"});
    sec.classList.remove("jump"); void sec.offsetWidth; sec.classList.add("jump");
  });
});

/* ---------------- rename on double-click ---------------- */
function beginRename(pill){
  const lbl = pill.querySelector(".lbl");
  if (!lbl || lbl.querySelector("input")) return;
  const id = (pill.querySelector(".go")?.getAttribute("href") || "").split("/").pop();
  if (!BY_ID[id]) return;
  const before = titleOf(BY_ID[id]);
  lbl.innerHTML = "";
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = before; inp.spellcheck = false;
  lbl.append(inp); inp.focus(); inp.select();

  let closed = false;
  const finish = commit => {
    if (closed) return; closed = true;
    if (commit) setTitle(id, inp.value);
    route();                                  // re-render from state, never patch the DOM
  };
  inp.addEventListener("keydown", ev => {
    if (ev.key === "Enter"){ ev.preventDefault(); finish(true); }
    if (ev.key === "Escape"){ ev.preventDefault(); finish(false); }
  });
  inp.addEventListener("blur", () => finish(true));
  inp.addEventListener("dblclick", ev => ev.stopPropagation());
}

/* ---------------- adding a task ----------------
   The form opens INSIDE the day you pressed + on, so the date is chosen by
   where you clicked rather than by a field you have to fill in and can get
   wrong. Everything else defaults to whatever the current filters are set to:
   if you are looking at Guess When scripting work, that is almost certainly
   what you are about to add. */
function openComposer(d){
  document.querySelector(".composer")?.remove();
  const slot = document.querySelector('.day[data-d="' + d + '"] .slot');
  if (!slot) return;
  const selWorks = cur => '<select name="work">' +
    worksFor(PFILTER !== "all" ? PFILTER : "gw").map(w =>
      '<option value="' + w + '"' + (w === cur ? " selected" : "") + ">" +
      esc(WORKS[w].name) + "</option>").join("") + "</select>";
  const sel = (name, obj, cur) => '<select name="' + name + '">' +
    Object.entries(obj).map(([k,v]) =>
      '<option value="' + k + '"' + (k === cur ? " selected" : "") + ">" +
      esc(v.name || v) + "</option>").join("") + "</select>";

  const box = document.createElement("form");
  box.className = "composer";
  box.innerHTML =
    '<input name="t" placeholder="What needs doing?" autocomplete="off" required>' +
    '<div class="row">' +
      sel("cat",  CATS,   PFILTER !== "all" ? PFILTER : "gw") +
      selWorks(WFILTER !== "all" && WFILTER !== "none" ? WFILTER : worksFor(PFILTER)[0]) +
      sel("size", {minor:"Minor", moderate:"Moderate", major:"Major"}, "moderate") +
      sel("who",  PEOPLE, FILTER  !== "all" ? FILTER  : DEFAULT_WHO) +
      '<button type="submit">Add</button>' +
      '<button type="button" class="x">Cancel</button>' +
    "</div>";
  slot.append(box);
  box.querySelector("input").focus();

  box.addEventListener("submit", ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(box).entries());
    if (!f.t.trim()) return;
    addTask(d, {t:f.t.trim(), cat:f.cat, work:f.work, size:f.size, who:f.who});
    route();
    openComposer(d);                     // stay open — adding one usually means adding three
  });
  box.querySelector(".x").addEventListener("click", () => { box.remove(); });
  box.addEventListener("keydown", ev => { if (ev.key === "Escape") box.remove(); });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-add]");
  if (b) openComposer(b.dataset.add);
  if (e.target.closest("[data-addtype]")) openTypeMaker();
});

/* A new work type belongs to ONE project — that is the whole point of making
   them per-project — so it is only offered while a project is selected, and it
   picks one of the four existing colour slots rather than inventing a fifth
   colour that would not survive the separation check. */
function openTypeMaker(){
  if (PFILTER === "all") return;
  document.querySelector(".typemaker")?.remove();
  const host = document.querySelector("[data-addtype]");
  if (!host) return;
  const f = document.createElement("form");
  f.className = "typemaker";
  f.innerHTML = '<input name="name" placeholder="Type name" autocomplete="off" required>' +
    '<div class="slots">' + [1,2,3,4].map(n =>
      '<label><input type="radio" name="slot" value="' + n + '"' + (n===1?" checked":"") +
      '><i class="sw w' + n + '"></i></label>').join("") + "</div>" +
    '<div class="row"><button type="submit">Add</button>' +
    '<button type="button" class="x">Cancel</button></div>';
  host.after(f);
  f.querySelector("input").focus();
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(f).entries());
    const name = d.name.trim(); if (!name) return;
    let id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "type";
    while (WORKS[id]) id += "-2";
    WORKS[id] = EDITS.works[id] = {name, slot:+d.slot};
    (PROJECT_WORKS[PFILTER] ||= []).push(id);
    (EDITS.projWorks[PFILTER] ||= []).push(id);
    saveEdits(); route();
  });
  f.querySelector(".x").addEventListener("click", () => f.remove());
  f.addEventListener("keydown", ev => { if (ev.key === "Escape") f.remove(); });
}

/* ---------------- drag a chip to another day ----------------
   HTML5 drag-and-drop is not an option: it has no touch support. Pointer
   events with two entry points — the grip commits at once (touch-action:none
   keeps the browser out of it), a press-and-hold elsewhere waits 240ms so a
   flick still scrolls. */
let drag = null, raf = 0, suppressClick = false;
const HOLD = 240, SLOP = 10;

document.addEventListener("pointerdown", e => {
  const pill = e.target.closest(".pill");
  if (!pill || document.body.classList.contains("dragging")) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest(".go") || e.target.closest("input")) return;
  if (pill.classList.contains("proc")) return;          // a process has no date to move
  const id = (pill.querySelector(".go")?.getAttribute("href") || "").split("/").pop();
  if (!BY_ID[id]) return;

  const start = {x:e.clientX, y:e.clientY};
  if (e.target.closest(".grip")){ begin(pill, id, start); return; }

  /* MOUSE AND TOUCH WANT OPPOSITE RULES, and conflating them is what broke
     this the first time.
       touch — moving your finger means SCROLL, so a hold starts the drag and
               any movement before it cancels;
       mouse — press-and-move IS the drag gesture, nobody scrolls by dragging
               content, so movement STARTS it and there is no delay to sit
               through.
     Written as one path with a cancel, a desktop drag never begins: the first
     mouse movement trips the same guard that protects scrolling on a phone. */
  const isMouse = e.pointerType === "mouse";
  let live = true;
  const timer = isMouse ? 0 : setTimeout(() => { if (live) begin(pill, id, start); }, HOLD);
  const stop = () => { live = false; clearTimeout(timer);
    removeEventListener("pointermove", watch); removeEventListener("pointerup", stop);
    removeEventListener("pointercancel", stop); };
  const watch = ev => {
    if (!live) return;
    if (Math.hypot(ev.clientX-start.x, ev.clientY-start.y) <= SLOP) return;
    if (isMouse){ stop(); begin(pill, id, {x:ev.clientX, y:ev.clientY}); }
    else stop();                       // the finger is scrolling, let it
  };
  addEventListener("pointermove", watch, {passive:true});
  addEventListener("pointerup", stop, {passive:true});
  addEventListener("pointercancel", stop, {passive:true});
});

function begin(pill, id, start){
  const r = pill.getBoundingClientRect();
  const ghost = pill.cloneNode(true);
  ghost.id = "ghost"; ghost.style.width = r.width + "px";
  document.body.append(ghost);
  pill.classList.add("lifted");
  document.body.classList.add("dragging");
  navigator.vibrate?.(12);
  drag = {id, pill, ghost, dx:start.x - r.left, dy:start.y - r.top, y:start.y, over:null};
  move(start.x, start.y);
  addEventListener("pointermove", onMove, {passive:false});
  addEventListener("pointerup", onUp, {passive:true});
  addEventListener("pointercancel", onUp, {passive:true});
  raf = requestAnimationFrame(edgeScroll);
}

function move(x, y){
  drag.ghost.style.transform = "translate(" + (x-drag.dx) + "px," + (y-drag.dy) + "px)";
  drag.y = y;
  drag.ghost.style.visibility = "hidden";            // or it hit-tests itself
  const el = document.elementFromPoint(x, y);
  drag.ghost.style.visibility = "";
  const sec = el && el.closest(".day");
  if (sec !== drag.over){
    drag.over?.classList.remove("over");
    drag.over = sec;
    sec?.classList.add("over");
  }
}
const onMove = e => { e.preventDefault(); move(e.clientX, e.clientY); };

function edgeScroll(){
  if (!drag) return;
  const EDGE = 90, h = innerHeight;
  if (drag.y < EDGE) scrollBy(0, -Math.ceil((EDGE - drag.y)/5));
  else if (drag.y > h - EDGE) scrollBy(0, Math.ceil((drag.y - (h - EDGE))/5));
  raf = requestAnimationFrame(edgeScroll);
}

function onUp(){
  if (!drag) return;
  cancelAnimationFrame(raf);
  removeEventListener("pointermove", onMove);
  removeEventListener("pointerup", onUp);
  removeEventListener("pointercancel", onUp);
  const to = drag.over ? drag.over.dataset.d : null;
  const id = drag.id;
  drag.ghost.remove(); drag.pill.classList.remove("lifted");
  drag.over?.classList.remove("over");
  document.body.classList.remove("dragging");
  drag = null;
  suppressClick = true; setTimeout(() => suppressClick = false, 80);
  if (to != null && to !== dateOf(BY_ID[id])){ setDate(id, to); route(); }
}

/* ---------------- hash router ----------------
   Hash, not paths: this is a static site, so /t/drag would 404 on a reload.
   The hash keeps one file, real bookmarkable links, and a working back button. */
const wrap = document.getElementById("wrap");
let listScroll = 0;

function stashBanner(){
  const n = editCount();
  if (!n) return "";
  const nn = Object.keys(EDITS.names).length, nd = Object.keys(EDITS.dates).length,
        na = EDITS.added.length;
  const bits = [];
  const nw = Object.keys(EDITS.works).length;
  if (nw) bits.push(nw + " work type" + (nw>1?"s":""));
  if (na) bits.push(na + " new task" + (na>1?"s":""));
  if (nn) bits.push(nn + " rename" + (nn>1?"s":""));
  if (nd) bits.push(nd + " date" + (nd>1?"s":"") + " moved");
  return '<div class="stash"><span><b>' + bits.join(" · ") +
    '</b> — on this device only</span><button id="stashcopy">Copy for the file</button></div>';
}

function route(){
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/t\/([\w-]+)$/);
  const sect = (hash.match(/^#\/([\w-]*)$/) || [,null])[1];

  if (m && BY_ID[m[1]]){
    // A detail page is reached by link and must open whoever it belongs to,
    // so the filter is hidden rather than applied.
    document.body.className = "detail";
    tabsEl.hidden = true;
    renderRail(null);
    wrap.innerHTML = detailView(BY_ID[m[1]]);
    scrollTo(0,0);
  } else if (sect && SECTIONS.some(s => s.id === sect && !s.live)){
    const s = SECTIONS.find(x => x.id === sect);
    document.body.className = "detail";
    tabsEl.hidden = true;
    renderRail(sect);
    wrap.innerHTML = '<a class="back" href="#/">‹ Progress</a>' +
      '<h1 class="dtitle">' + s.name + "</h1>" +
      '<div class="card">Not built yet. This page is a placeholder so the ' +
      'navigation is honest about what exists.</div>';
    scrollTo(0,0);
  } else {
    document.body.className = "list";
    tabsEl.hidden = false;
    renderTabs();
    renderRail("");
    wrap.innerHTML = doneToggle() + rollToggle() + '<div class="wstrip pstrip">' + projButtons(null) + "</div>" +
                     '<div class="wstrip">' + workButtons() + "</div>" +
                     listView() + stashBanner();
    renderCal();
    scrollTo(0, listScroll);
  }
}
addEventListener("hashchange", route);

// remember where the list was, so coming back doesn't dump you at the top
document.addEventListener("click", e => {
  if (e.target.closest(".go")) listScroll = scrollY;
  if (e.target.id === "stashcopy"){
    const rows = [];
    // types first: a task referencing a type that does not exist in the file
    // would paste in as grey, so the definition has to travel with it
    for (const [k,v] of Object.entries(EDITS.works))
      rows.push("  WORKS." + k + " = " + JSON.stringify(v) + ";");
    for (const [pf,l] of Object.entries(EDITS.projWorks))
      rows.push("  PROJECT_WORKS." + pf + ".push(" + l.map(x=>JSON.stringify(x)).join(", ") + ");");
    // a new task exports as a pasteable TASKS entry, not as a diff
    for (const t of EDITS.added){
      const o = {id:t.id, work:t.work, d:t.d, cat:t.cat, pct:0, size:t.size, t:t.t};
      if (t.who && t.who !== DEFAULT_WHO) o.who = t.who;
      rows.push("  " + JSON.stringify(o) + ",");
    }
    if (EDITS.added.length && (Object.keys(EDITS.names).length || Object.keys(EDITS.dates).length))
      rows.push("\n  /* and edits to existing entries: */");
    for (const [k,v] of Object.entries(EDITS.names)) rows.push("  " + k + "  t: " + JSON.stringify(v));
    for (const [k,v] of Object.entries(EDITS.dates)) rows.push("  " + k + "  d: " + JSON.stringify(v));
    const line = "/* apply these to the matching entries in TASKS */\n" + rows.join("\n");
    navigator.clipboard?.writeText(line);
    e.target.textContent = "Copied";
  }
});
// double-click a chip to rename it; the single click still belongs to the link
document.addEventListener("dblclick", e => {
  if (suppressClick) return;              // the tail of a drag, not a double-click
  const pill = e.target.closest(".pill");
  if (pill && !e.target.closest(".go") && !e.target.closest(".grip")) beginRename(pill);
});
route();
</script>
