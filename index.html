<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress — CandleLit Studio</title>
<meta name="description" content="Task completion by day.">
<style>
  /* Fills are darkened steps of validated hues so WHITE LABEL TEXT clears
     4.5:1 at the lightest end of each gradient — the bright originals failed
     it badly (the green sat near 2.6:1). They also hold 4:1 against both page
     surfaces and pass all-pairs colourblind separation. */
  :root{
    color-scheme: light;
    --plane:#fbfbfa; --surface:#fff;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#8a8983;
    --rule:#e6e5e2; --ring:rgba(11,11,11,.09);
    --gw-a:#2976d2;    --gw-b:#2261ac;
    --admin-a:#c1552b; --admin-b:#9e4623;
    --site-a:#15875e;  --site-b:#116f4d;
    --park-a:#767671;  --park-b:#61615d;
    --rest:#4c4b47;
    --on:#fff;
    /* PEOPLE. The four category hues above already own blue / orange / green /
       grey, so violet and magenta are what is left that cannot be mistaken for
       a category. Both clear 4.5:1 against the white initial (6.0 and 5.5) —
       and the initial is the real encoding, colour only reinforces it, the
       same way size is backed by the word on the detail page. */
    --who-don:#6d4aca; --who-anna:#c02a6e;
    --glass:rgba(255,255,255,.82); --glass-ring:rgba(11,11,11,.10);
    --shadow:0 1px 2px rgba(11,11,11,.07);
    --now-shadow:0 2px 10px rgba(11,11,11,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --plane:#141413; --surface:#1e1e1c;
      --ink:#fff; --ink-2:#c3c2b7; --ink-muted:#8e8d87;
      --rule:#2c2c2a; --ring:rgba(255,255,255,.11);
      --rest:#565550;
      --glass:rgba(30,30,28,.84); --glass-ring:rgba(255,255,255,.13);
      --shadow:none; --now-shadow:0 2px 12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#141413; --surface:#1e1e1c;
    --ink:#fff; --ink-2:#c3c2b7; --ink-muted:#8e8d87;
    --rule:#2c2c2a; --ring:rgba(255,255,255,.11);
    --rest:#565550;
    --glass:rgba(30,30,28,.84); --glass-ring:rgba(255,255,255,.13);
    --shadow:none; --now-shadow:0 2px 12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--plane);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:600px;margin:0 auto;
        padding:16px 14px calc(48px + env(safe-area-inset-bottom))}

  /* ---------------- desktop shell ----------------
     Phone stays exactly as it was: one column, the rails simply absent. The
     side columns only exist above 1000px, where there is room for them
     WITHOUT squeezing the feed — the feed keeps its 600px either way, so the
     chips never reflow between layouts. */
  .shell{display:block}
  .rail,.cal{display:none}
  /* WIDTH ALONE IS NOT "IS THIS A PC". Media queries measure CSS pixels, so a
     1440x2560 phone at DPR 3-4 reports ~360-480 portrait and ~850 landscape —
     it would never match 1000px anyway. But hover:hover is the honest test:
     it asks whether there is a cursor, which is what a side rail actually
     needs. A phone answers hover:none however many physical pixels it has. */
  @media (min-width:1000px) and (hover:hover){
    .shell{
      display:grid;justify-content:center;align-items:start;
      grid-template-columns:186px minmax(0,600px) 250px;
      gap:0 26px;
    }
    .rail,.cal{display:block;position:sticky;top:18px;padding-top:22px}
    .wrap{padding-top:22px}
    .tabs{left:auto;right:26px;transform:none}   /* out of the centre column */
  }

  /* left rail — the other pages of this hub */
  .rail h3,.cal h3{
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
    color:var(--ink-muted);margin:0 0 9px;padding-left:11px;
  }
  .rail a{
    display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;
    color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:550;
  }
  .rail a:hover{background:var(--surface);color:var(--ink)}
  .rail a[aria-current="page"]{background:var(--ink);color:var(--plane);font-weight:650}
  .rail a i{font-style:normal;width:15px;text-align:center;font-size:12px;opacity:.75}
  .rail a[aria-current="page"] i{opacity:1}
  .rail .soon{opacity:.45}
  .rail .soon:hover{background:none;color:var(--ink-2);cursor:default}

  /* right rail — month at a glance, clicking a day jumps to it */
  .cal .mon{
    background:var(--surface);border:1px solid var(--ring);border-radius:12px;
    padding:11px 12px 12px;margin-bottom:10px;
  }
  .cal .mt{font-size:12.5px;font-weight:650;margin:0 0 8px;text-align:center}
  .cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal .dow{font-size:9px;color:var(--ink-muted);text-align:center;font-weight:700;padding-bottom:3px}
  .cal button{
    appearance:none;border:0;background:none;font:inherit;cursor:pointer;
    aspect-ratio:1;border-radius:6px;font-size:11px;color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;position:relative;padding:0;
  }
  .cal button:disabled{color:var(--ink-muted);opacity:.3;cursor:default}
  .cal button:hover:not(:disabled){background:var(--rule)}
  .cal button.has{font-weight:700;color:var(--ink)}
  /* a dot means work sits on that day — the number alone cannot say that */
  .cal button.has::after{
    content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:3px;height:3px;border-radius:50%;background:var(--gw-a);
  }
  .cal button.today{background:var(--ink);color:var(--plane);font-weight:700}
  .cal button.today.has::after{background:var(--plane)}
  .cal button.away{opacity:.42}
  .cal .key{font-size:10.5px;color:var(--ink-muted);padding:2px 2px 0;line-height:1.7}
  .cal .key b{color:var(--ink-2);font-weight:600}

  /* rename-in-place: the input replaces the label, inheriting its box so the
     chip does not resize or jump when editing starts */
  .lbl input{
    width:100%;font:inherit;font-size:inherit;font-weight:inherit;color:inherit;
    background:rgba(0,0,0,.22);border:0;border-radius:6px;
    padding:3px 7px;margin:-3px 0;outline:1px solid rgba(255,255,255,.35);
    user-select:text;-webkit-user-select:text;
  }
  .day.jump{animation:jump 1.1s ease-out}
  @keyframes jump{0%,22%{background:var(--drop,rgba(41,118,210,.14))}100%{background:transparent}}
  .stash{
    margin:14px 0 0;padding:10px 13px;border-radius:10px;
    background:var(--surface);border:1px solid var(--ring);
    font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center;
  }
  .stash b{color:var(--ink);font-weight:650}
  .stash button{
    margin-left:auto;appearance:none;font:inherit;font-size:12px;cursor:pointer;
    background:var(--ink);color:var(--plane);border:0;border-radius:7px;padding:5px 10px;
  }
  /* Only the list makes room for the floating tabs — the detail page hides
     them, and reserving the space there would leave a hole above the title. */
  body.list .wrap{padding-top:calc(64px + env(safe-area-inset-top))}

  /* ---------------- who filter ---------------- */
  .tabs{
    position:fixed;z-index:20;
    top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;gap:2px;padding:4px;border-radius:999px;
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 2px 14px rgba(11,11,11,.13), inset 0 0 0 1px var(--glass-ring);
  }
  .tabs[hidden]{display:none}
  .tab{
    appearance:none;border:0;background:none;cursor:pointer;font:inherit;
    display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
    font-size:12.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-pressed="true"]{background:var(--ink);color:var(--plane)}
  .tab .n{font-size:10.5px;font-weight:700;opacity:.6;font-variant-numeric:tabular-nums}
  .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--who)}

  .empty{text-align:center;color:var(--ink-muted);font-size:14px;padding:40px 10px}
  .empty b{color:var(--ink-2)}

  /* ---------------- day block ---------------- */
  .day{margin-bottom:14px}
  .dh{display:flex;align-items:baseline;gap:8px;padding:6px 4px 7px;
      border-bottom:1px solid var(--rule)}
  .dh .dd{font-size:13px;font-weight:650;color:var(--ink-2);letter-spacing:-.01em}
  .dh .dw{font-size:11.5px;color:var(--ink-muted)}
  .dh .note{margin-left:auto;font-size:11px;color:var(--ink-muted);text-align:right}
  .slot{padding-top:8px;display:flex;flex-direction:column;gap:7px}
  .slot:empty::after{content:"—";color:var(--ink-muted);opacity:.35;font-size:12px;padding-left:4px}

  .day.now{margin:6px 0 20px}
  .day.now .dh{border-bottom:2px solid var(--ink);padding-bottom:8px}
  .day.now .dh .dd{font-size:17px;color:var(--ink);letter-spacing:-.02em}
  .day.next .dh{border-bottom-color:var(--ink-2)}
  .day.next .dh .dd{font-size:15px;color:var(--ink)}
  .flag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
        padding:3px 8px;border-radius:99px;background:var(--ink);color:var(--plane);align-self:center}
  .day.next .flag{background:none;color:var(--ink-2);border:1px solid var(--rule)}
  .day.now .slot{gap:9px}
  .day.now .pill{box-shadow:var(--now-shadow), inset 0 0 0 1px rgba(255,255,255,.09)}

  .gap{display:flex;align-items:baseline;gap:8px;padding:7px 4px;margin-bottom:14px;
       border-bottom:1px dashed var(--rule);font-size:12px;color:var(--ink-muted)}
  .gap .r{font-weight:600;color:var(--ink-2)}
  .gap .n{margin-left:auto;font-size:11px}

  .day.past{opacity:.42;transition:opacity .15s}
  .day.past:hover,.day.past:focus-within{opacity:.9}
  .hist{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
        color:var(--ink-muted);padding:2px 4px 8px}
  .rule{border:0;border-top:1px solid var(--rule);margin:16px 0 18px}

  /* ---------------- chip ---------------- */
  .pill{
    --p:0%;
    /* a chip is a button, and buttons do not get text-selected — without this
       a double-click to rename highlights the label first */
    user-select:none;-webkit-user-select:none;
    border-radius:999px;overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.07);
    background:
      linear-gradient(90deg,
        rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--p),
        var(--rest) var(--p), var(--rest) 100%),
      linear-gradient(170deg,var(--a),var(--b));
    transition:filter .12s;
  }
  .cat-gw   {--a:var(--gw-a);    --b:var(--gw-b)}
  .cat-admin{--a:var(--admin-a); --b:var(--admin-b)}
  .cat-site {--a:var(--site-a);  --b:var(--site-b)}
  .cat-park {--a:var(--park-a);  --b:var(--park-b)}
  .pill:hover{filter:brightness(1.06)}

  /* SIZE — height is the encoding. Magnitude read as magnitude, legible while
     scrolling past. The word also appears on the detail page, so weight is
     never carried by height alone. */
  .top{display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;
       color:var(--on);min-height:44px}
  .sz-moderate .top{min-height:56px}
  .sz-major    .top{min-height:72px}
  .sz-major    .lbl{font-size:15.5px;font-weight:600}
  .sz-minor    .lbl{font-size:13.5px}

  /* A PROCESS has no finish, so its bar cannot mean completion. The stripes
     say "this cycles" at a glance, and the filled part is how far through the
     current cycle it is — full means due. Same grammar, different meaning. */
  .pill.proc{
    background:
      repeating-linear-gradient(115deg,
        var(--rest) 0 6px, rgba(255,255,255,.045) 6px 12px) var(--p) 0 / 100% no-repeat,
      linear-gradient(90deg,
        rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--p),
        var(--rest) var(--p), var(--rest) 100%),
      linear-gradient(170deg,var(--a),var(--b));
  }
  .pill.proc .cyc{
    flex:none;font-size:10.5px;font-weight:700;opacity:.85;
    letter-spacing:.02em;white-space:nowrap;
  }
  .pill.proc.due  .cyc{opacity:1}
  .pill.proc.over .cyc{background:var(--on);color:var(--rest);
    padding:2px 7px;border-radius:99px;opacity:1}

  .glyph{flex:none;font-size:10px;opacity:.8;width:11px;text-align:center}
  .lbl{flex:1;font-size:14px;line-height:1.35;min-width:0;font-weight:500;padding:9px 0}
  .pct{flex:none;font-size:11.5px;font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}

  /* OWNER. A white ring, not a bare disc — the circle sits on four different
     category gradients and must separate from all of them. */
  .who{
    flex:none;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:800;color:#fff;background:var(--who);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.88);
  }
  .sz-major .who{width:25px;height:25px;font-size:11.5px}
  .who-don {--who:var(--who-don)}
  .who-anna{--who:var(--who-anna)}
  .go{
    flex:none;align-self:stretch;display:flex;align-items:center;
    padding:0 15px;color:var(--on);opacity:.6;font-size:15px;
    text-decoration:none;cursor:pointer;
  }
  .go:hover{opacity:1}

  /* ---------------- detail ---------------- */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-muted);
        text-decoration:none;font-size:13px;padding:4px 0 14px}
  .back:hover{color:var(--ink)}
  .dtitle{font-size:22px;line-height:1.25;margin:0 0 10px;letter-spacing:-.02em}
  .dmeta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
  .tag{display:inline-flex;align-items:center;gap:6px;
       font-size:11px;font-weight:650;padding:4px 10px;border-radius:99px;
       border:1px solid var(--ring);color:var(--ink-2)}
  .tag.fill{color:var(--on);border-color:transparent;background:var(--a)}
  .bar{height:8px;border-radius:99px;background:var(--rest);overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}

  .sec{margin-bottom:22px}
  .sec h2{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
          color:var(--ink-muted);margin:0 0 9px;font-weight:700}
  .card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;
        padding:13px 15px;font-size:14px;color:var(--ink)}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
  .steps li{display:flex;gap:11px;padding:11px 15px;border-top:1px solid var(--rule);
            font-size:14px;color:var(--ink-2);align-items:flex-start}
  .steps li:first-child{border-top:0}
  .steps .box{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--rule);
              margin-top:1px;display:flex;align-items:center;justify-content:center;
              font-size:10px;color:transparent}
  .steps li.on .box{background:var(--ink);border-color:var(--ink);color:var(--plane)}
  .steps li.on span{color:var(--ink-muted);text-decoration:line-through;text-decoration-thickness:1px}
  .dep{display:flex;flex-direction:column;gap:7px}
  .log{display:flex;flex-direction:column;gap:0}
  .log div{padding:11px 15px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink-2)}
  .log div:first-child{border-top:0}
  .log b{display:block;font-size:11px;color:var(--ink-muted);font-weight:600;margin-bottom:2px}
  .links{display:flex;flex-direction:column;gap:0}
  .links a{display:block;padding:11px 15px;border-top:1px solid var(--rule);
           font-size:13.5px;color:var(--ink);text-decoration:none}
  .links a:first-child{border-top:0}
  .links a:hover{color:var(--gw-a)}
  .none{color:var(--ink-muted);font-size:13px;padding:2px 4px}
  .pad0{padding:0}
</style>
</head>
<body class="list">
<nav class="tabs" id="tabs" aria-label="Filter by person"></nav>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Sections"></aside>
  <div class="wrap" id="wrap"></div>
  <aside class="cal" id="cal" aria-label="Calendar"></aside>
</div>

<script>
/* ==========================================================
   id    unique, used by the URL (#/t/<id>) and by needs[]
   d     the day it sits on ("" = no date, listed at the end)
   pct   completion 0-100
   cat   gw | admin | site | park
   size  minor | moderate | major   (effort, NOT importance)
   done  what finished actually means — one line
   needs ids this task waits on; "blocks" is derived from it
   who   owner id from PEOPLE; omitted means DEFAULT_WHO
   ========================================================== */
const TASKS = [
  {id:"studio", d:"2026-07-23", cat:"site", pct:100, size:"moderate", t:"Studio site",
   done:"Live on its own domain over HTTPS.",
   links:[["candlelitstudio.co.uk","https://candlelitstudio.co.uk"]]},

  {id:"h2o", d:"2026-07-25", cat:"site", pct:100, size:"moderate", t:"Well-drilling site",
   done:"Live, indexable, and the domain renewed.",
   links:[["mb-h2o.lt","https://mb-h2o.lt"]]},

  {id:"years", d:"2026-08-08", cat:"gw", pct:100, size:"major", t:"Review the 291 suspect years",
   done:"Every suspect answered and the corrected deck live.",
   note:"The dates were verified at harvest — against the wrong claim. Wikidata's inception for the entity is not the date the card's verb asks about.",
   sub:[["Diagnose and bucket",1],["Research every suspect",1],["Apply and upload",1]],
   log:[["2026-08-08","237 corrected, 20 kept because the flag was wrong, 34 held back for a decision. Deck live."],
        ["2026-08-08","Biggest single fix: gas lighting 300 → 1792. Out by 1,492 years."]]},

  {id:"sweep", d:"2026-08-08", cat:"gw", pct:100, size:"moderate", t:"Deck quality sweep",
   done:"Categories and fields corrected deck-wide.",
   log:[["2026-08-08","73 categories and 56 fields corrected. 73 cards had 'invention' on things nobody invented."]]},

  {id:"toasts", d:"2026-08-09", cat:"gw", pct:100, size:"minor", t:"Wrong-placement message fixes",
   done:"Reads correctly on a phone, not just in the editor.",
   sub:[["Wrap by width, not a newline",1],["Move -HP below the result",1],["Retime all three beats",1]],
   log:[["2026-08-09","Wrapped by width rather than a hard newline — a newline would have broken the localisation key across 13 languages."],
        ["2026-08-09","'first one is free - 3 more cards' read as MINUS three. Now '+3 cards'."]]},

  {id:"expedition", d:"2026-08-09", cat:"gw", pct:100, size:"major", t:"Expedition roguelite mode",
   done:"A run plays end to end, entrance to boss.",
   note:"The bet: an RPG layer brings in players who don't care about history trivia. Optional, so it can't alienate the ones who do.",
   log:[["2026-08-09","Map, routes, 12 relics, boss, rest and shop nodes, balance simulator."],
        ["2026-08-09","Sim reports novice 0%, average 43%, expert 100%. A 0% novice tier is the bridge thesis failing — but the sim carries no relics, so it's a floor not a forecast."]]},

  {id:"track", d:"2026-08-10", cat:"gw", pct:0, size:"minor", t:"Push a build to the test track",
   done:"Testers are playing the same build you are.",
   note:"The store is on versionCode 9 while the working build is 21. The closed test is not testing the ship build.",
   sub:[["Pick the build to promote",0],["Upload to closed test",0],["Confirm testers get it",0]]},

  {id:"cards", d:"2026-08-10", cat:"gw", pct:0, size:"major", t:"Rule the 79 held cards",
   done:"All 79 ruled and handed back to be applied.",
   note:"Phone work — read a card, make a call. These need a person, not a script.",
   sub:[["34 wrong-title cards",0],["45 quality cards",0],["Hand rulings back",0]]},

  {id:"sec", d:"2026-08-10", cat:"admin", pct:60, size:"moderate", t:"Security housekeeping",
   done:"The originals are deleted and the important ones rotated. Copying is not the finish.",
   note:"ESTIMATE — 31 items left, but the starting total was never recorded. Correct it.",
   sub:[["Work the list",0],["Delete the originals",0],["Rotate the important ones",0]]},

  {id:"email", d:"2026-08-11", cat:"gw", pct:100, size:"minor", t:"Fix store support-email typo",
   done:"The listed address is one that is actually monitored.",
   note:"Verified 11 Aug against the live Play API and both privacy pages — every one of them already reads kozzzygames@gmail.com, and the two-z spelling appears in no file anywhere. Either it was fixed unlogged or the original sighting was wrong.",
   log:[["2026-08-11","Checked rather than assumed: edits.details.get returns contactEmail=kozzzygames@gmail.com. Nothing to change."]]},

  {id:"drag", d:"2026-08-11", cat:"gw", pct:0, size:"major", t:"Drag and prediction projection",
   done:"Clearly better on a phone by the 13th — or reverted. Not 'perfect'.",
   note:"The only item on the list with no natural definition of done, which is why it has a hard cutoff. The current drag works and testers are playing it.",
   needs:["track"],
   sub:[["Prototype the projection",0],["Play it on a phone",0],["Keep or revert",0]]},

  {id:"reveal", d:"2026-08-11", cat:"gw", pct:90, size:"moderate", t:"Relic year reveals",
   done:"Relics in a run uncover parts of the year, and the card shows it.",
   note:"The tab reads as a tab now because it has paper under it. A shape with no edges has no correct position — which is why the old one was 'troublesome to position' and got deleted.",

/* ==========================================================
   PROCESSES — work with no finish. No pct and no "done when";
   they are measured by RECENCY instead.
     every   the rhythm, as a label
     last    when it last happened
     next    when it is next due ("" = continuous, no due date)
     from    "launch" = does not start until the game ships
   ========================================================== */
const PROCESSES = [
  {id:"reviews", cat:"gw", size:"moderate", t:"Reply to store reviews",
   every:"continuous", last:"", next:"", from:"launch",
   healthy:"No review sits more than a couple of days without a reply.",
   note:"Starts the day it goes to production. Early reviews carry the most weight and are the cheapest to answer."},

  {id:"events", cat:"gw", size:"major", t:"Run seasonal events",
   every:"per season", last:"", next:"", from:"launch",
   healthy:"Something new to come back for, on a rhythm players can predict.",
   note:"Live-ops. The reason a returning player has a reason. Not before launch."},

  {id:"pass", cat:"gw", size:"major", t:"Battlepass cycles",
   every:"per season", last:"", next:"", from:"launch",
   healthy:"A cycle never ends without the next one ready.",
   note:"A dead pass between seasons is worse than no pass. Only worth starting once retention justifies it."},

  {id:"rota", cat:"admin", size:"minor", t:"Check the rota",
   every:"weekly · Thursdays", last:"2026-08-06", next:"2026-08-13",
   healthy:"Shifts known for the week ahead, and told to the manager.",
   note:"Issued Thursday evening. Bills minimum is two shifts a week — missing the rota is how a week quietly goes under."},

  {id:"paper", cat:"admin", size:"minor", t:"Monthly paperwork",
   every:"monthly", last:"2026-08-06", next:"2026-09-10",
   healthy:"Filed every month, including the empty ones. The penalty is for not filing, not for the amount.",
   note:"⚠ The one after next lands mid-trip — file it before leaving."}
];

const DAYNOTES = {
  "2026-08-09":"shift night", "2026-08-10":"desk day", "2026-08-11":"desk day",
  "2026-08-12":"shift night", "2026-08-13":"desk day · rota out", "2026-08-14":"desk day",
  "2026-08-29":"ship decision", "2026-09-05":"hard wall"
};
const HORIZON = 21;

const GLYPH = {gw:"●", admin:"◆", site:"▲", park:"○"};
const CATS  = {gw:"Guess When", admin:"Admin", site:"Sites", park:"Parked"};

/* PEOPLE — the colour lives in CSS as .who-<id>, the same split the categories
   already use: JS holds the structure, CSS holds the palette. Adding a third
   person is one line here and one line there.
   A row with no `who` belongs to DEFAULT_WHO. This list was one person's before
   it was two, so spelling the default onto every row would only make the rows
   that DO differ harder to spot. */
const PEOPLE = {
  don:  {name:"Don",  initial:"D"},
  anna: {name:"Anna", initial:"A"}
};
const DEFAULT_WHO = "don";
const whoOf = t => PEOPLE[t.who] ? t.who : DEFAULT_WHO;
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const TODAY = iso(new Date());
const TOMORROW = addDays(TODAY,1);
const BY_ID = Object.fromEntries([...TASKS, ...PROCESSES].map(t => [t.id,t]));
const IS_PROC = Object.fromEntries(PROCESSES.map(p => [p.id,true]));
const days = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);

/* A process is judged on recency, not completion. The bar shows how far
   through the current cycle it is: full means due now. */
function procState(p){
  if (p.from === "launch") return {label:"at launch", pct:0, cls:"", when:"Not started"};
  if (!p.next) return {label:"ongoing", pct:100, cls:"", when:"Continuous"};
  const left = days(TODAY, p.next);
  const span = p.last ? Math.max(1, days(p.last, p.next)) : 1;
  const pct  = Math.max(0, Math.min(100, Math.round((span - left) / span * 100)));
  if (left < 0)  return {label:"overdue " + (-left) + "d", pct:100, cls:"over",
                         when:"Overdue by " + (-left) + " days"};
  if (left === 0) return {label:"due today", pct:100, cls:"due", when:"Due today"};
  return {label:"due in " + left + "d", pct, cls: left <= 2 ? "due" : "",
          when:"Due in " + left + " days"};
}
// "blocks" is the inverse of needs — derived, so the two can never disagree
const BLOCKS = {};
for (const t of TASKS) for (const n of (t.needs||[])) (BLOCKS[n] ||= []).push(t.id);

const paintPct = p => p === 0 ? 12 : Math.max(0, Math.min(100,p));

/* ---------------- renames ----------------
   A rename lives in localStorage, not in the file, because the page is static
   and there is nothing to POST to. That makes it DEVICE-LOCAL: real on this
   browser, invisible everywhere else. The stash banner exists so that is never
   a silent surprise — it shows the count and hands over the line to paste into
   TASKS, which is the only thing that makes a rename permanent. */
const RENAME_KEY = "renames.v1";
let RENAMES = {};
try { RENAMES = JSON.parse(localStorage.getItem(RENAME_KEY) || "{}"); } catch(e){}

const titleOf = t => RENAMES[t.id] || t.t;
function setTitle(id, text){
  const orig = BY_ID[id];
  if (!orig) return;
  const clean = text.trim();
  if (!clean || clean === orig.t) delete RENAMES[id];   // back to the original = not a rename
  else RENAMES[id] = clean;
  try { localStorage.setItem(RENAME_KEY, JSON.stringify(RENAMES)); } catch(e){}
}

function avatar(t){
  const id = whoOf(t), p = PEOPLE[id];
  return '<span class="who who-' + id + '" title="' + esc(p.name) + '">' +
         esc(p.initial) + "</span>";
}
const ownerTag = t =>
  '<span class="tag"><span class="dot who-' + whoOf(t) + '"></span>' +
  esc(PEOPLE[whoOf(t)].name) + "</span>";

function chip(t){
  if (IS_PROC[t.id]){
    const s = procState(t);
    return '<article class="pill proc ' + s.cls + " cat-" + t.cat + " sz-" + t.size +
             '" style="--p:' + s.pct + '%"><div class="top">' +
        '<span class="glyph" aria-hidden="true">↻</span>' +
        '<span class="lbl">' + esc(titleOf(t)) + "</span>" +
        '<span class="cyc">' + s.label + "</span>" +
        avatar(t) +
        '<a class="go" href="#/t/' + t.id + '" aria-label="Open ' + esc(titleOf(t)) + '">›</a>' +
      "</div></article>";
  }
  const pct = Math.max(0, Math.min(100, t.pct));
  return '<article class="pill cat-' + t.cat + " sz-" + t.size +
           '" style="--p:' + paintPct(pct) + '%">' +
      '<div class="top">' +
        '<span class="glyph" aria-hidden="true">' + GLYPH[t.cat] + "</span>" +
        '<span class="lbl">' + esc(titleOf(t)) + "</span>" +
        '<span class="pct">' + pct + "%</span>" +
        avatar(t) +
        '<a class="go" href="#/t/' + t.id + '" aria-label="Open ' + esc(titleOf(t)) + '">›</a>' +
      "</div></article>";
}

/* ---------------- who filter ----------------
   Kept in localStorage rather than the hash: the hash is the ROUTE, and a
   filter that travelled in a link would mean sending somebody a page with
   half the work silently missing. */
let FILTER = "all";
try { FILTER = localStorage.getItem("who") || "all"; } catch(e){}
if (FILTER !== "all" && !PEOPLE[FILTER]) FILTER = "all";
const mine = t => FILTER === "all" || whoOf(t) === FILTER;

/* Counts are OPEN work only. Counting everything would make a person's number
   grow as they finished things, which is backwards. */
function openCount(id){
  const pick = x => id === "all" || whoOf(x) === id;
  return TASKS.filter(x => pick(x) && x.pct < 100).length +
         PROCESSES.filter(x => pick(x) && x.from !== "launch").length;
}

const tabsEl = document.getElementById("tabs");
function renderTabs(){
  tabsEl.innerHTML = ["all", ...Object.keys(PEOPLE)].map(id =>
    '<button class="tab" type="button" data-who="' + id + '" aria-pressed="' +
      (FILTER === id) + '">' +
      (id === "all" ? "" : '<span class="dot who-' + id + '"></span>') +
      "<span>" + esc(id === "all" ? "All" : PEOPLE[id].name) + "</span>" +
      '<span class="n">' + openCount(id) + "</span></button>").join("");
}
tabsEl.addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (!b || b.dataset.who === FILTER) return;
  FILTER = b.dataset.who;
  try { localStorage.setItem("who", FILTER); } catch(e){}
  listScroll = 0;              // the feed is a different length now
  renderTabs();
  wrap.innerHTML = listView();
  scrollTo(0,0);
});

/* ---------------- list view ---------------- */
function listView(){
  /* Filtering happens ONCE, here at the source. Everything downstream — the
     empty-day runs, the history block, the undated section — then collapses on
     its own, with no second idea of what is visible. */
  const tasks = TASKS.filter(mine);

  /* Processes sit below the timeline rather than on a day — they are not
     scheduled, they are kept up. Overdue and due-soon float to the top of
     their own section so upkeep slipping is still visible. */
  const rank = p => { const s = procState(p);
    return s.cls === "over" ? 0 : s.cls === "due" ? 1 : p.from === "launch" ? 3 : 2; };
  const ongoing = PROCESSES.filter(mine).sort((a,b) => rank(a) - rank(b));

  if (!tasks.length && !ongoing.length)
    return '<div class="empty">Nothing assigned to <b>' +
           esc(PEOPLE[FILTER].name) + "</b> yet.</div>";

  const byDay = {};
  for (const t of tasks) (byDay[t.d] ||= []).push(t);

  function block(d, cls){
    const dt = parse(d), note = DAYNOTES[d];
    const flag = d === TODAY ? '<span class="flag">Today</span>'
               : d === TOMORROW ? '<span class="flag">Tomorrow</span>' : "";
    // data-d is the anchor the calendar jumps to
    return '<section class="day ' + cls + '" data-d="' + d + '"><div class="dh">' +
      '<span class="dd">' + dt.getDate() + " " + MO[dt.getMonth()] + "</span>" +
      '<span class="dw">' + WD[dt.getDay()] + "</span>" + flag +
      (note ? '<span class="note">' + note + "</span>" : "") + "</div>" +
      '<div class="slot">' + (byDay[d] || []).map(chip).join("") + "</div></section>";
  }
  function rangeLabel(a,b){
    const x = parse(a), y = parse(b);
    const left = x.getDate() + (x.getMonth() === y.getMonth() ? "" : " " + MO[x.getMonth()]);
    return a === b ? x.getDate()+" "+MO[x.getMonth()]
                   : left + " – " + y.getDate() + " " + MO[y.getMonth()];
  }
  const gapRow = run => '<div class="gap"><span class="r">' +
    rangeLabel(run[0], run[run.length-1]) + "</span><span>" +
    (run.length === 1 ? WD[parse(run[0]).getDay()] : run.length + " days") +
    '</span><span class="n">clear</span></div>';

  const past = Object.keys(byDay).filter(d => d && d < TODAY).sort();
  let last = addDays(TODAY, HORIZON);
  for (const d in byDay)    if (d && d > last) last = d;
  for (const d in DAYNOTES) if (d > last) last = d;

  let html = "";
  if (past.length) html += '<div class="hist">History</div>' +
    past.map(d => block(d,"past")).join("") + '<hr class="rule">';

  let run = [];
  for (let d = TODAY; d <= last; d = addDays(d,1)){
    const pinned = (d === TODAY || d === TOMORROW);
    const empty  = !(byDay[d] || []).length && !DAYNOTES[d];
    if (empty && !pinned){ run.push(d); continue; }
    if (run.length){ html += gapRow(run); run = []; }
    html += block(d, d === TODAY ? "now" : d === TOMORROW ? "next" : "");
  }
  if (run.length) html += gapRow(run);

  if (byDay[""]) html += '<hr class="rule"><div class="hist">No date</div>' +
    '<div class="slot">' + byDay[""].map(chip).join("") + "</div>";

  if (ongoing.length)
    html += '<hr class="rule"><div class="hist">Ongoing · no finish</div>' +
            '<div class="slot">' + ongoing.map(chip).join("") + "</div>";
  return html;
}

/* ---------------- detail view ---------------- */
function depChip(id){
  const t = BY_ID[id];
  if (!t) return "";
  return '<article class="pill cat-' + t.cat + ' sz-minor" style="--p:' +
    paintPct(t.pct) + '%"><div class="top">' +
    '<span class="glyph" aria-hidden="true">' + GLYPH[t.cat] + "</span>" +
    '<span class="lbl">' + esc(titleOf(t)) + "</span>" +
    '<span class="pct">' + t.pct + "%</span>" +
    avatar(t) +
    '<a class="go" href="#/t/' + t.id + '">›</a></div></article>';
}

function processView(p){
  const s = procState(p);
  const sec = (title, inner, flush) =>
    '<div class="sec"><h2>' + title + '</h2>' +
    (flush ? '<div class="card pad0">' + inner + "</div>" : inner) + "</div>";

  let h = '<a class="back" href="#/">‹ All tasks</a>' +
    '<div class="cat-' + p.cat + '">' +
    '<h1 class="dtitle">' + esc(titleOf(p)) + "</h1>" +
    '<div class="dmeta">' +
      '<span class="tag fill">↻ Process</span>' +
      ownerTag(p) +
      '<span class="tag">' + esc(p.every) + "</span>" +
      '<span class="tag">' + p.size + "</span>" +
      '<span class="tag">' + s.when + "</span>" +
    "</div>" +
    '<div class="bar"><i style="width:' + s.pct + '%"></i></div>' +
    "</div>";

  // no "done when" — a process cannot be finished, only kept up
  if (p.healthy) h += sec("Healthy when", '<div class="card">' + esc(p.healthy) + "</div>");
  if (p.note)    h += sec("Why", '<div class="card">' + esc(p.note) + "</div>");

  h += sec("Rhythm", '<div class="log">' +
    "<div><b>Every</b>" + esc(p.every) + "</div>" +
    "<div><b>Last</b>" + (p.last ? p.last + " · " + days(p.last, TODAY) + " days ago"
                                 : "never") + "</div>" +
    "<div><b>Next</b>" + (p.from === "launch" ? "when the game ships"
                          : p.next || "no fixed date — it just runs") + "</div>" +
    "</div>", true);
  return h;
}

function detailView(t){
  if (IS_PROC[t.id]) return processView(t);
  const when = t.d
    ? (t.d === TODAY ? "Today" : t.d === TOMORROW ? "Tomorrow"
       : WD[parse(t.d).getDay()] + " " + parse(t.d).getDate() + " " + MO[parse(t.d).getMonth()])
    : "No date";
  const blocks = BLOCKS[t.id] || [];
  const sec = (title, inner, flush) =>
    '<div class="sec"><h2>' + title + '</h2>' +
    (flush ? '<div class="card pad0">' + inner + "</div>" : inner) + "</div>";

  let h = '<a class="back" href="#/">‹ All tasks</a>' +
    '<div class="cat-' + t.cat + '">' +
    '<h1 class="dtitle">' + esc(titleOf(t)) + "</h1>" +
    '<div class="dmeta">' +
      '<span class="tag fill">' + GLYPH[t.cat] + " " + CATS[t.cat] + "</span>" +
      ownerTag(t) +
      '<span class="tag">' + t.size + "</span>" +
      '<span class="tag">' + when + "</span>" +
      '<span class="tag">' + t.pct + "% done</span>" +
    "</div>" +
    '<div class="bar"><i style="width:' + Math.max(0,Math.min(100,t.pct)) + '%"></i></div>' +
    "</div>";

  if (t.done) h += sec("Done when", '<div class="card">' + esc(t.done) + "</div>");
  if (t.note) h += sec("Why", '<div class="card">' + esc(t.note) + "</div>");

  if ((t.needs||[]).length){
    const open = t.needs.filter(id => BY_ID[id] && BY_ID[id].pct < 100);
    h += sec("Blocked by" + (open.length ? "" : " — all clear"),
      '<div class="dep">' + t.needs.map(depChip).join("") + "</div>");
  }
  if (blocks.length)
    h += sec("Blocks", '<div class="dep">' + blocks.map(depChip).join("") + "</div>");

  if ((t.sub||[]).length)
    h += sec("Steps", '<ul class="steps">' + t.sub.map(s =>
      '<li class="' + (s[1] ? "on" : "") + '"><span class="box">✓</span><span>' +
      esc(s[0]) + "</span></li>").join("") + "</ul>", true);

  if ((t.links||[]).length)
    h += sec("Links", '<div class="links">' + t.links.map(l =>
      '<a href="' + l[1] + '" target="_blank" rel="noopener">' + esc(l[0]) + " ↗</a>").join("") + "</div>", true);

  if ((t.log||[]).length)
    h += sec("Log", '<div class="log">' + t.log.slice().reverse().map(e =>
      "<div><b>" + e[0] + "</b>" + esc(e[1]) + "</div>").join("") + "</div>", true);

  return h;
}

/* ---------------- left rail ----------------
   The hub's other pages. Three do not exist yet and say so rather than
   linking nowhere — a dead link that looks live is worse than an honest
   "not built". */
const SECTIONS = [
  {id:"",             icon:"◧", name:"Progress",     live:true},
  {id:"pipeline",     icon:"❡", name:"Article pipeline"},
  {id:"firebase",     icon:"◆", name:"Firebase"},
  {id:"architecture", icon:"⌘", name:"Architecture"}
];
function renderRail(active){
  document.getElementById("rail").innerHTML = "<h3>Sections</h3>" +
    SECTIONS.map(s => s.live
      ? '<a href="#/' + s.id + '"' + (active === s.id ? ' aria-current="page"' : "") +
        '><i>' + s.icon + "</i>" + s.name + "</a>"
      : '<a class="soon" href="#/' + s.id + '"' + (active === s.id ? ' aria-current="page"' : "") +
        '><i>' + s.icon + "</i>" + s.name + "</a>"
    ).join("");
}

/* ---------------- right rail: the month ----------------
   Two months, because the ship date is usually in the next one. A dot marks a
   day that holds work; clicking jumps to that day in the feed. */
function renderCal(){
  const byDay = {};
  for (const t of TASKS.filter(mine)) if (t.d) (byDay[t.d] ||= []).push(t);
  const away = d => (typeof AWAY !== "undefined" ? AWAY : []).some(r => d >= r.from && d <= r.to);

  let html = "<h3>Calendar</h3>";
  const start = parse(TODAY);
  for (let k = 0; k < 2; k++){
    const y = start.getFullYear(), m = start.getMonth() + k;
    const first = new Date(y, m, 1), total = new Date(y, m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;                    // Monday-first
    html += '<div class="mon"><p class="mt">' + MO[first.getMonth()] + " " + first.getFullYear() +
      '</p><div class="grid">' +
      ["M","T","W","T","F","S","S"].map(d => '<div class="dow">' + d + "</div>").join("") +
      '<div style="grid-column:span ' + (lead || 7) + '"></div>'.repeat(lead ? 1 : 0);
    for (let n = 1; n <= total; n++){
      const key = first.getFullYear() + "-" + pad(first.getMonth()+1) + "-" + pad(n);
      const cls = [byDay[key] ? "has" : "", key === TODAY ? "today" : "", away(key) ? "away" : ""]
                    .filter(Boolean).join(" ");
      const n2 = (byDay[key] || []).length;
      html += '<button data-d="' + key + '" class="' + cls + '"' +
        (n2 ? ' title="' + n2 + ' task' + (n2>1?"s":"") + '"' : "") + ">" + n + "</button>";
    }
    html += "</div></div>";
  }
  html += '<p class="key"><b>•</b> a day holding work · <b>tap</b> to jump to it</p>';
  document.getElementById("cal").innerHTML = html;
}
document.getElementById("cal").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  if (location.hash && location.hash !== "#/") { location.hash = "#/"; }
  requestAnimationFrame(() => {
    const sec = document.querySelector('.day[data-d="' + b.dataset.d + '"]');
    if (!sec) return;
    sec.scrollIntoView({block:"center", behavior:"smooth"});
    sec.classList.remove("jump"); void sec.offsetWidth; sec.classList.add("jump");
  });
});

/* ---------------- rename on double-click ---------------- */
function beginRename(pill){
  const lbl = pill.querySelector(".lbl");
  if (!lbl || lbl.querySelector("input")) return;
  const id = (pill.querySelector(".go")?.getAttribute("href") || "").split("/").pop();
  if (!BY_ID[id]) return;
  const before = titleOf(BY_ID[id]);
  lbl.innerHTML = "";
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = before; inp.spellcheck = false;
  lbl.append(inp); inp.focus(); inp.select();

  let closed = false;
  const finish = commit => {
    if (closed) return; closed = true;
    if (commit) setTitle(id, inp.value);
    route();                                  // re-render from state, never patch the DOM
  };
  inp.addEventListener("keydown", ev => {
    if (ev.key === "Enter"){ ev.preventDefault(); finish(true); }
    if (ev.key === "Escape"){ ev.preventDefault(); finish(false); }
  });
  inp.addEventListener("blur", () => finish(true));
  inp.addEventListener("dblclick", ev => ev.stopPropagation());
}

/* ---------------- hash router ----------------
   Hash, not paths: this is a static site, so /t/drag would 404 on a reload.
   The hash keeps one file, real bookmarkable links, and a working back button. */
const wrap = document.getElementById("wrap");
let listScroll = 0;

function stashBanner(){
  const n = Object.keys(RENAMES).length;
  if (!n) return "";
  return '<div class="stash"><span><b>' + n + '</b> rename' + (n>1?"s":"") +
    ' saved on this device only</span><button id="stashcopy">Copy for the file</button></div>';
}

function route(){
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/t\/([\w-]+)$/);
  const sect = (hash.match(/^#\/([\w-]*)$/) || [,null])[1];

  if (m && BY_ID[m[1]]){
    // A detail page is reached by link and must open whoever it belongs to,
    // so the filter is hidden rather than applied.
    document.body.className = "detail";
    tabsEl.hidden = true;
    renderRail(null);
    wrap.innerHTML = detailView(BY_ID[m[1]]);
    scrollTo(0,0);
  } else if (sect && SECTIONS.some(s => s.id === sect && !s.live)){
    const s = SECTIONS.find(x => x.id === sect);
    document.body.className = "detail";
    tabsEl.hidden = true;
    renderRail(sect);
    wrap.innerHTML = '<a class="back" href="#/">‹ Progress</a>' +
      '<h1 class="dtitle">' + s.name + "</h1>" +
      '<div class="card">Not built yet. This page is a placeholder so the ' +
      'navigation is honest about what exists.</div>';
    scrollTo(0,0);
  } else {
    document.body.className = "list";
    tabsEl.hidden = false;
    renderTabs();
    renderRail("");
    wrap.innerHTML = listView() + stashBanner();
    renderCal();
    scrollTo(0, listScroll);
  }
}
addEventListener("hashchange", route);

// remember where the list was, so coming back doesn't dump you at the top
document.addEventListener("click", e => {
  if (e.target.closest(".go")) listScroll = scrollY;
  if (e.target.id === "stashcopy"){
    const line = "/* paste over the matching t: values in TASKS */\n" +
      Object.entries(RENAMES).map(([k,v]) => `  ${k}: ${JSON.stringify(v)}`).join(",\n");
    navigator.clipboard?.writeText(line);
    e.target.textContent = "Copied";
  }
});
// double-click a chip to rename it; the single click still belongs to the link
document.addEventListener("dblclick", e => {
  const pill = e.target.closest(".pill");
  if (pill && !e.target.closest(".go")) beginRename(pill);
});
route();
</script>
