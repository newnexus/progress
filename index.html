<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress — CandleLit Studio</title>
<meta name="description" content="Task completion.">
<style>
  /* Fills are darkened steps of validated hues so WHITE LABEL TEXT clears
     4.5:1 at the lightest end of each gradient — the bright originals failed
     it badly (the green sat near 2.6:1). They also hold 4:1 against both page
     surfaces and pass all-pairs colourblind separation. */
  :root{
    color-scheme: light;
    --plane:#fbfbfa; --surface:#fff;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#8a8983;
    --rule:#cfcecb; --ring:rgba(11,11,11,.09);
    --gw-a:#2976d2;    --gw-b:#2261ac;
    --admin-a:#c1552b; --admin-b:#9e4623;
    --site-a:#15875e;  --site-b:#116f4d;
    --park-a:#767671;  --park-b:#61615d;
    --rest:#4c4b47;
    --on:#fff;
    --shadow:0 1px 2px rgba(11,11,11,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --plane:#141413; --surface:#1e1e1c;
      --ink:#fff; --ink-2:#c3c2b7; --ink-muted:#8e8d87;
      --rule:#3d3d39; --ring:rgba(255,255,255,.11);
      --rest:#565550;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#141413; --surface:#1e1e1c;
    --ink:#fff; --ink-2:#c3c2b7; --ink-muted:#8e8d87;
    --rule:#3d3d39; --ring:rgba(255,255,255,.11);
    --rest:#565550;
    --shadow:none;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--plane);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .list{
    max-width:600px;margin:0 auto;
    padding:22px 14px calc(40px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;
  }

  /* The chip IS the bar: layer one paints the remainder grey from the completion
     point rightward, layer two is the category fill underneath. --p is inline. */
  .pill{
    --p:0%;
    border-radius:999px;overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.07);
    background:
      linear-gradient(90deg,
        rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--p),
        var(--rest) var(--p), var(--rest) 100%),
      linear-gradient(170deg,var(--a),var(--b));
    transition:border-radius .16s, filter .12s;
  }
  .cat-gw   {--a:var(--gw-a);    --b:var(--gw-b)}
  .cat-admin{--a:var(--admin-a); --b:var(--admin-b)}
  .cat-site {--a:var(--site-a);  --b:var(--site-b)}
  .cat-park {--a:var(--park-a);  --b:var(--park-b)}
  .pill:hover{filter:brightness(1.06)}
  .pill.open{border-radius:18px}

  .top{
    display:flex;align-items:center;gap:10px;padding:11px 16px;
    color:var(--on);cursor:pointer;
  }
  /* shape carries the category as well as hue, so a solid chip is never
     identifiable by colour alone */
  .glyph{flex:none;font-size:10px;opacity:.8;width:11px;text-align:center}
  .lbl{flex:1;font-size:14px;line-height:1.35;min-width:0;font-weight:500}
  .pct{
    flex:none;font-size:11.5px;font-weight:700;opacity:.9;
    font-variant-numeric:tabular-nums;letter-spacing:.01em;
  }
  .chev{flex:none;font-size:10px;opacity:.65;transition:transform .16s}
  .pill.open .chev{transform:rotate(90deg)}

  .fold{display:none;background:var(--surface);padding:12px 16px 14px}
  .pill.open .fold{display:block}
  .fold p{margin:0;font-size:12.5px;color:var(--ink-muted)}
  .fold ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .fold p + ul{margin-top:10px}
  .fold li{display:flex;gap:9px;font-size:13px;color:var(--ink-2)}
  .fold li::before{content:"–";color:var(--ink-muted);flex:none}
  .fold li.on{color:var(--ink-muted);text-decoration:line-through;text-decoration-thickness:1px}
</style>
</head>
<body>
<div class="list" id="list"></div>

<script>
/* ==========================================================
   pct = completion, 0–100. cat = gw | admin | site | park
   ========================================================== */
const TASKS = [
  {cat:"gw", pct:100, t:"Review the 291 suspect years",
   note:"237 corrected, 20 kept, 34 held back. Deck live.",
   sub:[["Diagnose and bucket",1],["Research every suspect",1],["Apply and upload",1]]},

  {cat:"gw", pct:100, t:"Deck quality sweep",
   note:"73 categories and 56 fields corrected."},

  {cat:"gw", pct:100, t:"Wrong-placement message fixes",
   note:"Wrapping, timing and the -HP position.",
   sub:[["Wrap by width, not a newline",1],["Move -HP below the result",1],["Retime all three beats",1]]},

  {cat:"gw", pct:100, t:"Expedition roguelite mode",
   note:"Map, routes, relics, boss, balance simulator."},

  {cat:"gw", pct:0, t:"Push a build to the test track",
   note:"Store is on versionCode 9 while the working build is 21.",
   sub:[["Pick the build to promote",0],["Upload to closed test",0],["Confirm testers get it",0]]},

  {cat:"gw", pct:0, t:"Rule the 79 held cards",
   note:"Phone work — read a card, make a call.",
   sub:[["34 wrong-title cards",0],["45 quality cards",0],["Hand rulings back",0]]},

  {cat:"gw", pct:0, t:"Drag and prediction projection",
   note:"Hard cutoff. If it isn't clearly better, ship what already works.",
   sub:[["Prototype the projection",0],["Play it on a phone",0],["Keep or revert",0]]},

  {cat:"gw", pct:0, t:"Component placement",
   sub:[["Lay out the play area",0],["Check both screen widths",0]]},

  {cat:"gw", pct:0, t:"Look and visual polish",
   sub:[["Colour and spacing pass",0],["Lithuanian overflow check",0]]},

  {cat:"gw", pct:0, t:"Test Expedition on non-trivia players",
   note:"The bridge thesis. The testers written off as cosmetic are the only ones who can prove it.",
   sub:[["Get it to four of them",0],["Watch for unprompted play",0]]},

  {cat:"gw", pct:0, t:"Multiplayer stress test",
   note:"Book the people first — calendars are the long pole, not the code."},

  {cat:"gw", pct:0, t:"Fix store support-email typo"},

  {cat:"gw", pct:0, t:"Ship decision",
   note:"Target the 29th. The 5th of September is the hard wall."},

  {cat:"admin", pct:60, t:"Security housekeeping",
   note:"ESTIMATE — 31 items left but the starting total was never recorded. Correct the number.",
   sub:[["Work the list",0],["Delete the originals",0],["Rotate the important ones",0]]},

  {cat:"admin", pct:0, t:"Monthly paperwork",
   note:"Do it before leaving — the deadline lands mid-trip."},

  {cat:"admin", pct:0, t:"Give notice for the time away"},

  {cat:"site", pct:100, t:"Studio site"},
  {cat:"site", pct:100, t:"Well-drilling site"},
  {cat:"site", pct:90,  t:"Contact form activation",
   note:"Everything else is live. Waiting on one sign-off."},

  {cat:"park", pct:0, t:"Vector art tool",         note:"After the farm season."},
  {cat:"park", pct:0, t:"European localisation",   note:"Post-launch."},
  {cat:"park", pct:0, t:"Self-hosted card images", note:"Post-launch."}
];

const GLYPH = {gw:"●", admin:"◆", site:"▲", park:"○"};

document.getElementById("list").innerHTML = TASKS.map((t,i) => {
  const pct = Math.max(0, Math.min(100, t.pct));
  // floored for PAINT only so a 0% task keeps a coloured cap and stays
  // identifiable; the printed number is always the true value
  const paint = pct === 0 ? 12 : pct;
  const body = t.note || (t.sub && t.sub.length);
  return '<article class="pill cat-' + t.cat + '" style="--p:' + paint + '%" data-i="' + i + '">' +
      '<div class="top">' +
        '<span class="glyph" aria-hidden="true">' + GLYPH[t.cat] + "</span>" +
        '<span class="lbl">' + t.t + "</span>" +
        '<span class="pct">' + pct + "%</span>" +
        (body ? '<span class="chev">▶</span>' : "") +
      "</div>" +
      (body ? '<div class="fold">' +
        (t.note ? "<p>" + t.note + "</p>" : "") +
        (t.sub ? "<ul>" + t.sub.map(s =>
          '<li class="' + (s[1] ? "on" : "") + '">' + s[0] + "</li>").join("") + "</ul>" : "") +
      "</div>" : "") +
    "</article>";
}).join("");

document.getElementById("list").addEventListener("click", e => {
  const top = e.target.closest(".top");
  if (top && top.parentElement.querySelector(".fold")) top.parentElement.classList.toggle("open");
});
</script>
</body>
</html>
